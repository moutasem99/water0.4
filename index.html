function closeDaySummaryV54(day){
  const invoices=(day.invoices||[]).filter(i=>!i.cancelled);
  const cashSales=invoices.filter(i=>(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const clickSales=invoices.filter(i=>(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const totalSales=cashSales+clickSales;
  const expenses=(day.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  const draws=(day.draws||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  const wages=(day.wages||[]).reduce((s,x)=>s+Number(x.hours||0)*Number(x.rate||0),0);
  const morning=shiftTotals('صباحي',day);
  const evening=shiftTotals('مسائي',day);

  const shiftCard=(st,label)=>`
    <div class="v54-close-shift">
      <div class="v54-close-shift-head"><b>${label}</b><span>${st.invoiceCount} فاتورة</span></div>
      <div><span>العهدة</span><b>${Number(st.openingCash||0).toFixed(2)}</b></div>
      <div><span>مبيعات نقدية</span><b>${Number(st.cashSales||0).toFixed(2)}</b></div>
      <div><span>الكاش المتوقع</span><b>${Number(st.expectedCash||0).toFixed(2)}</b></div>
      <div><span>الكاش الفعلي</span><b>${st.actualCash===null?'—':Number(st.actualCash).toFixed(2)}</b></div>
      <div class="v54-close-diff ${st.cashDiff===null?'neutral':st.cashDiff===0?'ok':st.cashDiff>0?'plus':'minus'}">
        <span>فرق الصندوق</span>
        <b>${st.cashDiff===null?'غير مدخل':`${st.cashDiff>0?'+':''}${Number(st.cashDiff).toFixed(2)} د.أ`}</b>
      </div>
    </div>`;

  return `
    <div class="v54-close-summary">
      <div class="v54-close-top">
        <div class="v54-close-date">${formatDate(day.date||new Date().toISOString())}</div>
        <div class="v54-close-invoices">${invoices.length} فاتورة فعالة</div>
      </div>

      <div class="v54-close-cash-hero">
        <span>النقدي من المبيعات</span>
        <strong>${cashSales.toFixed(2)} د.أ</strong>
        <small>هو الرقم الأساسي لمطابقة الصندوق</small>
      </div>

      <div class="v54-close-mini-grid">
        <div class="click"><span>كليك</span><b>${clickSales.toFixed(2)}</b></div>
        <div><span>إجمالي المبيعات</span><b>${totalSales.toFixed(2)}</b></div>
        <div class="expense"><span>المصاريف</span><b>${expenses.toFixed(2)}</b></div>
        <div class="draw"><span>السحوبات</span><b>${draws.toFixed(2)}</b></div>
        <div class="wage"><span>الأجور</span><b>${wages.toFixed(2)}</b></div>
        <div><span>الكوبونات</span><b>${shiftCouponCount('صباحي',day)+shiftCouponCount('مسائي',day)}</b></div>
      </div>

      <div class="v54-close-section-title">مطابقة الصندوق حسب الشفت</div>
      <div class="v54-close-shifts">
        ${shiftCard(morning,'الصباحي')}
        ${shiftCard(evening,'المسائي')}
      </div>

      <div class="v54-close-note">
        ${icon('check',14)}
        <span>راجع الكاش الفعلي وفرق كل شفت قبل الضغط على تأكيد الإغلاق.</span>
      </div>
    </div>`;
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(iso){
  try{ const d = new Date(iso); return d.toLocaleDateString('ar-EG', {year:'numeric',month:'long',day:'numeric'}); }catch(e){ return iso; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=> navigateTo(el.dataset.tab);
  });

  const adminUnlock=document.getElementById('btn-admin-unlock');
  if(adminUnlock){
    adminUnlock.onclick=()=>{
      const pass=prompt('أدخل كلمة السر للخروج من وضع الكاشير:');
      if(pass===null) return;
      if(pass!==S.config.password){
        showToast('كلمة السر غير صحيحة','error');
        return;
      }
      settingsAuthed=true;
      S.config.cashierMode=false;
      persist('config');
      tab='settings';
      showToast('تم فتح وضع الإدارة');
      render();
    };
  }

  // worker name (header)
  const workerInput = document.getElementById('worker-input');
  if(workerInput) workerInput.onchange = e=>{ S.today.activeWorker = e.target.value; persist('today'); };
  const headerCash = document.getElementById('header-opening-cash');
  if(headerCash) headerCash.onchange = e=>{
    const value=Math.max(0,Number(e.target.value||0));
    const shift=S.today.shift==='مسائي'?'مسائي':'صباحي';
    const key=shift==='مسائي'?'eveningOpeningCash':'morningOpeningCash';
    const before=Number(S.today[key]||0);
    S.today[key]=value;
    if(shift==='صباحي') S.today.openingCash=value;
    addAudit('تعديل عهدة الشفت',`${shift} — من أعلى الصفحة`,before,value);
    persist('today');
    showToast(`تم تحديث عهدة الشفت ${shift}`);
  };

  if(tab==='sales') bindSales();
  if(tab==='report') bindReport();
  if(tab==='inventory') bindInventory();
  if(tab==='archive') bindArchive();
  if(tab==='settings') bindSettings();

  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay){ modalState=null; render(); } };
}

function bindSales(){
  const customerSelect=document.getElementById('invoice-customer'); if(customerSelect) customerSelect.onchange=e=>{jardInputs.selectedCustomer=e.target.value;};
  document.getElementById('btn-open-day')?.addEventListener('click',()=>{
    const worker=document.getElementById('open-worker')?.value.trim();
    if(!worker){showToast('اكتب اسم البائع لافتتاح اليوم','error');return;}
    const opening=Math.max(0,Number(document.getElementById('open-cash')?.value||0));
    S.today.activeWorker=worker; S.today.shift=document.getElementById('open-shift')?.value||'صباحي'; S.today.openingCash=opening;
    if(S.today.shift==='مسائي') S.today.eveningOpeningCash=opening; else S.today.morningOpeningCash=opening;
    S.today.morningActualCash=''; S.today.eveningActualCash=''; S.today.actualCash=''; S.today.paymentMethod='نقدي'; S.today.dayOpened=true; S.today.openedAt=new Date().toISOString(); addAudit('افتتاح اليوم',`الشفت ${S.today.shift}، العهدة ${opening.toFixed(2)} د.أ`); persist('today'); render();
  });
  document.querySelectorAll('.grid-2 [data-add]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.add;
      const product = S.catalog.products.find(p=>p.id===id);
      const cart = S.today.cart;
      const existing = cart.find(i=>i.product.id===id);
      if(existing){
        existing.quantity++;
        persist('today');
        updateCartQuantityDOM(id);
      }else{
        cart.push({product, quantity:1});
        persist('today');
        refreshSalesCart();
      }
    };
  });
  bindSalesCartControls();
  const cashFloat = document.getElementById('sales-opening-cash');
  if(cashFloat) cashFloat.onchange = e=>{
    const value = Number(e.target.value || 0);
    S.today.openingCash = value < 0 ? 0 : value;
    persist('today');
    showToast('تم تحديث عهدة الكاش إلى ' + S.today.openingCash.toFixed(2) + ' د.أ');
  };


    const productSearch=document.getElementById('product-search');
  if(productSearch) productSearch.oninput=()=>{
    const q=productSearch.value.trim().toLowerCase();
    document.querySelectorAll('[data-product-name]').forEach(card=>{
      card.style.display=(card.dataset.productName||'').toLowerCase().includes(q)?'':'none';
    });
  };

  document.querySelectorAll('[data-payment]').forEach(btn=>{
    btn.onclick=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      const method=btn.dataset.payment==='كليك'?'كليك':'نقدي';
      S.today.paymentMethod=method;
      persist('today');
      document.querySelectorAll('[data-payment]').forEach(x=>{
        x.classList.toggle('active',x.dataset.payment===method);
      });
      showToast(`تم اختيار الدفع: ${method}`);
    };
  });

  const topHandoff=document.getElementById('btn-close-morning-shift-top');
  if(topHandoff){
    topHandoff.onclick=()=>{
      if(!S.today.morningJard){
        showToast('احفظ الجرد الصباحي أولاً','error');
        return;
      }
      if((S.today.cart||[]).length){
        showToast('احفظ أو أفرغ عربة البيع أولاً','error');
        return;
      }
      modalState={type:'close-morning-shift'};
      render();
    };
  };

  const coupon=document.getElementById('btn-coupon');
  if(coupon){
    coupon.onclick=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      const shift=S.today.shift==='مسائي'?'مسائي':'صباحي';
      if(shift==='مسائي') S.today.eveningCoupons=Number(S.today.eveningCoupons||0)+1;
      else S.today.morningCoupons=Number(S.today.morningCoupons||0)+1;
      syncCouponTotal();
      persist('today');
      const count=currentShiftCouponCount();
      const tile=document.getElementById('coupon-tile-count');
      const summary=document.getElementById('coupon-summary-count');
      if(tile) tile.textContent=`${count} ورقة`;
      if(summary) summary.textContent=`${count} ورقة`;
      showToast(`تم تسجيل ورقة كوبون للشفت ${shift}`);
    };
  }

  const editCoupons=document.getElementById('btn-edit-coupons');
  if(editCoupons) editCoupons.onclick=()=>{
    const shift=S.today.shift==='مسائي'?'مسائي':'صباحي';
    const pass=prompt(`أدخل كلمة السر لتعديل كوبونات الشفت ${shift}:`);
    if(pass===null) return;
    if(pass!==S.config.password){showToast('كلمة السر غير صحيحة','error');return;}
    const before=currentShiftCouponCount();
    const value=prompt(`أدخل عدد أوراق كوبون الشفت ${shift}:`,String(before));
    if(value===null) return;
    const number=Number(value);
    if(!Number.isInteger(number)||number<0){showToast('أدخل عدداً صحيحاً غير سالب','error');return;}
    if(shift==='مسائي') S.today.eveningCoupons=number; else S.today.morningCoupons=number;
    syncCouponTotal();
    addAudit('تعديل عدد الكوبونات',`الشفت ${shift} — تعديل محمي بكلمة السر`,before,number);
    persist('today');
    const tile=document.getElementById('coupon-tile-count');
    const summary=document.getElementById('coupon-summary-count');
    if(tile) tile.textContent=`${number} ورقة`;
    if(summary) summary.textContent=`${number} ورقة`;
    showToast(`تم تعديل كوبونات الشفت ${shift}`);
  };


  bindShiftFinancialEntries();

  // أزرار العربة والفاتورة تُربط داخل bindSalesCartControls لتحديث جزئي بلا وميض.
}

function bindShiftFinancialEntries(){
  const currentShift=()=>S.today.shift==='مسائي'?'مسائي':'صباحي';
  document.getElementById('btn-add-draw')?.addEventListener('click',()=>{
    const desc=document.getElementById('draw-desc')?.value.trim(); const amount=Number(document.getElementById('draw-amt')?.value||0);
    if(!desc||amount<=0){showToast('أدخل وصف السحب ومبلغاً صحيحاً','error');return;}
    S.today.draws.push({id:uid(),desc,amount,shift:currentShift(),worker:S.today.activeWorker,date:new Date().toISOString()}); addAudit('إضافة سحب',`${currentShift()} — ${desc} — ${amount.toFixed(2)} د.أ`); persist('today'); render();
  });
  document.getElementById('btn-add-exp')?.addEventListener('click',()=>{
    const desc=document.getElementById('exp-desc')?.value.trim(); const amount=Number(document.getElementById('exp-amt')?.value||0);
    if(!desc||amount<=0){showToast('أدخل وصف المصروف ومبلغاً صحيحاً','error');return;}
    S.today.expenses.push({id:uid(),desc,amount,shift:currentShift(),worker:S.today.activeWorker,date:new Date().toISOString()}); addAudit('إضافة مصروف',`${currentShift()} — ${desc} — ${amount.toFixed(2)} د.أ`); persist('today'); render();

function finalizeInvoiceV49(method){
  if(modalState?.type!=='invoice-payment-v49') return;
  if(!(S.today.cart||[]).length){
    modalState=null;
    render();
    showToast('العربة فارغة','error');
    return;
  }

  const sellerName=String(modalState.sellerName||S.today.activeWorker||'').trim();
  if(!sellerName){
    modalState=null;
    render();
    showToast('لا يمكن حفظ الفاتورة بدون اسم البائع','error');
    return;
  }

  const paymentMethod=method==='كليك'?'كليك':'نقدي';
  const customer=(S.config.customers||[]).find(c=>c.id===modalState.customerId);
  const invoice={
    id:nextInvoiceNumber(),
    date:new Date().toISOString(),
    items:invoiceItemsFromCart(),
    total:cartTotal(),
    worker:sellerName,
    customer:customer?{id:customer.id,name:customer.name,phone:customer.phone||''}:null,
    shift:S.today.shift||'صباحي',
    paymentMethod,
    cancelled:false
  };

  S.today.invoices=[invoice,...S.today.invoices];
  S.today.cart=[];
  jardInputs.selectedCustomer='';
  S.today.activeWorker=sellerName;

  // Keep the last method only as a harmless internal value for compatibility
  // with older stored data; it is no longer selected on the sales screen.
  S.today.paymentMethod=paymentMethod;

  addAudit('حفظ فاتورة',`فاتورة ${invoice.id} — ${paymentMethod} — ${invoice.total.toFixed(2)} د.أ`);
  persist('today');
  modalState=null;
  render();
  showToast(`تم تسجيل الفاتورة رقم ${invoice.id} — ${paymentMethod}`);
}

function bindProductDragReorder(){
  const list=document.getElementById('product-reorder-list');
  if(!list) return;
  let dragged=null;
  let pointerHandle=null;
  let moved=false;

  const clearMarks=()=>list.querySelectorAll('.drag-over').forEach(row=>row.classList.remove('drag-over'));
  const animateReorder=(mutate)=>{
    const rows=[...list.querySelectorAll('[data-reorder-product]')];
    const before=new Map(rows.map(r=>[r,r.getBoundingClientRect()]));
    mutate();
    rows.forEach(r=>{
      const first=before.get(r), last=r.getBoundingClientRect();
      if(!first)return;
      const dx=first.left-last.left, dy=first.top-last.top;
      if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
      try{r.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:190,easing:'cubic-bezier(.2,.8,.2,1)'});}catch(e){}
    });
  };
  const finish=(notify=true)=>{
    if(!dragged) return;
    dragged.classList.remove('dragging');
    clearMarks();
    if(moved) saveProductOrderFromDom(list,notify);
    dragged=null; pointerHandle=null; moved=false;
  };

  list.querySelectorAll('[data-reorder-product]').forEach(row=>{
    row.addEventListener('dragstart',event=>{
      if(!event.target.closest('[data-drag-handle]')){event.preventDefault();return;}
      dragged=row; moved=false; row.classList.add('dragging');
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('text/plain',row.dataset.reorderProduct||'');
    });
    row.addEventListener('dragover',event=>{
      if(!dragged||dragged===row)return;
      event.preventDefault(); row.classList.add('drag-over');
      const rect=row.getBoundingClientRect();
      const after=event.clientY>rect.top+rect.height/2;
      animateReorder(()=>list.insertBefore(dragged,after?row.nextSibling:row)); moved=true;
    });
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',event=>{event.preventDefault();clearMarks();});
    row.addEventListener('dragend',()=>finish(true));
  });

  list.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown',event=>{
      if(event.pointerType==='mouse') return; // سطح المكتب يستخدم السحب الأصلي
      const row=handle.closest('[data-reorder-product]'); if(!row)return;
      event.preventDefault(); dragged=row; pointerHandle=handle; moved=false;
      row.classList.add('dragging');
      try{handle.setPointerCapture(event.pointerId);}catch(e){}
    });
    handle.addEventListener('pointermove',event=>{
      if(!dragged||pointerHandle!==handle)return;
      event.preventDefault();
      const under=document.elementFromPoint(event.clientX,event.clientY)?.closest?.('[data-reorder-product]');
      clearMarks();
      if(!under||under===dragged||under.parentElement!==list)return;
      under.classList.add('drag-over');
      const rect=under.getBoundingClientRect();
      const after=event.clientY>rect.top+rect.height/2;
      animateReorder(()=>list.insertBefore(dragged,after?under.nextSibling:under)); moved=true;
    });
    const end=event=>{
      if(pointerHandle!==handle)return;
      try{handle.releasePointerCapture(event.pointerId);}catch(e){}
      finish(true);
    };
    handle.addEventListener('pointerup',end);
    handle.addEventListener('pointercancel',end);
  });
}

      if(!name){showToast('اسم المنتج لا يمكن أن يكون فارغًا','error');return;}
      if(!Number.isFinite(cost)||!Number.isFinite(price)||!Number.isFinite(bulkPrice)||cost<0||price<0||bulkPrice<0){showToast('تحقق من أسعار المنتج','error');return;}
      const before={name:product.name,category:product.category,cost:product.cost||0,price:product.price||0,bulkPrice:product.bulkPrice||0,bulkThreshold:product.bulkThreshold||0};
      product.name=name; product.category=category; product.cost=cost; product.price=price; product.bulkPrice=bulkPrice; product.bulkThreshold=bulkThreshold;
      (S.today.cart||[]).forEach(item=>{if(String(item.product?.id)===String(id)){item.product={...item.product,name,category,cost,price,bulkPrice,bulkThreshold};}});

  document.querySelectorAll('[data-del-prod]').forEach(el=>{

  document.getElementById('btn-add-mat')?.addEventListener('click', ()=>{
    const name = document.getElementById('new-mat-name').value.trim();
    const unit = document.getElementById('new-mat-unit').value.trim() || 'قطعة';

  document.querySelectorAll('[data-del-mat]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('حذف هذه المادة؟')){ S.catalog.inventoryItems = S.catalog.inventoryItems.filter(m=>m.id!==el.dataset.delMat); persist('catalog'); render(); } };
  });

  document.getElementById('btn-add-customer')?.addEventListener('click', ()=>{
    const name=document.getElementById('new-customer-name')?.value.trim();

    const address=document.getElementById('new-customer-address')?.value.trim()||'';

  });
  document.querySelectorAll('[data-del-customer]').forEach(el=>el.onclick=()=>{
    if(!confirm('حذف هذا العميل؟'))return;

    persist('config');render();showToast('تم حذف العميل');
  });
  document.getElementById('btn-add-maint')?.addEventListener('click', ()=>{
    const item=document.getElementById('maint-item')?.value.trim();
    const type=document.getElementById('maint-type')?.value.trim();
    const cost=Number(document.getElementById('maint-cost')?.value||0);
    const nextDate=document.getElementById('maint-next')?.value;
    const notes=document.getElementById('maint-notes')?.value.trim()||'';
    if(!item||!type||!nextDate||!Number.isFinite(cost)||cost<0){showToast('أكمل بيانات الصيانة بصورة صحيحة','error');return;}
    S.config.maintenance=S.config.maintenance||[];
    S.config.maintenance.push({id:uid(),item,type,cost,nextDate,notes,date:new Date().toISOString()});
    persist('config');render();showToast('تم حفظ سجل الصيانة');
  });
  document.querySelectorAll('[data-del-maint]').forEach(el=>el.onclick=()=>{
    if(!confirm('حذف سجل الصيانة؟'))return;
    S.config.maintenance=(S.config.maintenance||[]).filter(m=>String(m.id)!==String(el.dataset.delMaint));
    persist('config');render();showToast('تم حذف سجل الصيانة');
  });

  document.getElementById('btn-backup')?.addEventListener('click', ()=>{
    downloadBackup('manual');
    showToast('تم إنشاء النسخة الاحتياطية');
  });
  document.getElementById('btn-restore-pick')?.addEventListener('click', ()=>document.getElementById('restore-file')?.click());
  document.getElementById('restore-file')?.addEventListener('change', e=>{
    const file=e.target.files?.[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); const d=obj.data||obj; if(!d.config||!d.catalog||!d.today) throw new Error(); S=d; persist('config');persist('catalog');persist('today');persist('archive');if(!S.config.themeShades){const base=THEMES[S.config.theme]||THEMES.ocean;S.config.themeShades={...base};}if(!['light','dark','system'].includes(S.config.appearance))S.config.appearance='light';applyTheme(S.config.theme);applyAppearanceV55(S.config.appearance);showToast('تمت استعادة النسخة بنجاح');render(); }catch(err){showToast('ملف النسخة غير صالح','error');} }; r.readAsText(file);
  });

  document.getElementById('btn-full-reset')?.addEventListener('click', ()=>{
    if(confirm('مسح جميع بيانات اليوم والأرشيف بالكامل؟ لا يمكن التراجع.')){
      S.today = {cart:[], invoices:[], activeWorker:S.today.activeWorker, coupons:0, morningCoupons:0, eveningCoupons:0, draws:[], expenses:[], wages:[], morningJard:null, eveningJard:null, openingCash:0, actualCash:'', morningOpeningCash:0, morningActualCash:'', eveningOpeningCash:0, eveningActualCash:'', dayOpened:false, shift:'صباحي', morningShiftClosed:false, morningClosedAt:null, morningWorker:'', eveningStartedAt:null, paymentMethod:'نقدي', auditLog:[]};
      S.archive = [];
      persist('today'); persist('archive');
      showToast('تم تصفير النظام بنجاح'); render();

  });
}

/* modal generic confirm/cancel bindings (delegated after render) */
document.addEventListener('click', (e)=>{
  const action=e.target.closest('button')?.id||'';
  if(action==='modal-cancel'){
    modalState=null;
    render();
  }
  if(action==='modal-pay-cash-v49' && modalState?.type==='invoice-payment-v49'){
    finalizeInvoiceV49('نقدي');
    return;
  }
  if(action==='modal-pay-click-v49' && modalState?.type==='invoice-payment-v49'){
    finalizeInvoiceV49('كليك');
    return;
  }
  if(action==='modal-confirm' && modalState?.type==='pass-prompt'){
    const val = document.getElementById('modal-pass').value;
    modalState.onConfirm(val);
  }
  if(action==='modal-confirm-morning' && modalState?.type==='close-morning-shift'){
    const eveningWorker=document.getElementById('evening-worker-input')?.value.trim();
    const morningActualRaw=document.getElementById('morning-handoff-actual')?.value;
    const eveningOpeningRaw=document.getElementById('evening-opening-input')?.value;
    if(!eveningWorker){showToast('اكتب اسم عامل الشفت المسائي','error');return;}
    if(morningActualRaw===''||Number(morningActualRaw)<0){showToast('أدخل الكاش الفعلي للشفت الصباحي','error');return;}
    if(eveningOpeningRaw===''||Number(eveningOpeningRaw)<0){showToast('أدخل عهدة الشفت المسائي','error');return;}
    const morningWorker=S.today.activeWorker||S.today.morningJard?.worker||'-';
    S.today.morningActualCash=Number(morningActualRaw);
    S.today.eveningOpeningCash=Number(eveningOpeningRaw);
    S.today.morningShiftClosed=true;
    S.today.morningClosedAt=new Date().toISOString();
    S.today.morningWorker=morningWorker;
    S.today.shift='مسائي';
    S.today.activeWorker=eveningWorker;
    S.today.eveningStartedAt=new Date().toISOString();
    const morningDiff=shiftTotals('صباحي').cashDiff;
    addAudit('تسليم الشفت',`من ${morningWorker} إلى ${eveningWorker} — فرق الصباحي ${morningDiff===null?'—':morningDiff.toFixed(2)+' د.أ'} — عهدة المسائي ${S.today.eveningOpeningCash.toFixed(2)} د.أ`);
    persist('today');
    modalState=null;
    render();
    showToast('تم تسليم الشفت وفتح الشفت المسائي');
  }
  if(action==='modal-print' && modalState?.type==='close-day-summary'){
    if(window.savePdf47) window.savePdf47(modalState.day);
    else printA4Summary(modalState.day);
  }
  if(action==='modal-save-image-v48' && modalState?.type==='close-day-summary'){
    if(window.saveFinancialImage47) window.saveFinancialImage47(modalState.day,false);
  }
  if(action==='modal-share-image-v48' && modalState?.type==='close-day-summary'){
    if(window.saveFinancialImage47) window.saveFinancialImage47(modalState.day,true);
  }
  if(action==='modal-confirm-close' && modalState?.type==='close-day-summary'){
    const day = modalState.day;
    day.auditLog=[{id:uid(),date:new Date().toISOString(),action:'إغلاق اليوم',details:'تمت مطابقة الصندوق وأرشفة اليوم',worker:S.today.activeWorker},...(day.auditLog||[])];
    S.archive.push(day);
    downloadBackup('auto-close');
    S.today = {cart:[], invoices:[], activeWorker:S.today.activeWorker, coupons:0, morningCoupons:0, eveningCoupons:0, draws:[], expenses:[], wages:[], morningJard:null, eveningJard:null, openingCash:0, actualCash:'', morningOpeningCash:0, morningActualCash:'', eveningOpeningCash:0, eveningActualCash:'', dayOpened:false, shift:'صباحي', morningShiftClosed:false, morningClosedAt:null, morningWorker:'', eveningStartedAt:null, paymentMethod:'نقدي', auditLog:[]};
    persist('archive'); persist('today');
    modalState = null;
    jardInputs.archiveSel = dayKey(day.date);
    const closedDate = new Date(day.date);
    jardInputs.cal = {year: closedDate.getFullYear(), month: closedDate.getMonth()};
    tab='archive';
    render();
    showToast('تم إغلاق اليوم وبدء يوم جديد');
  }
});

/* ============================================================
   ONLINE / OFFLINE
   ============================================================ */
window.addEventListener('online', ()=>{ isOnline=true; renderStatusPill(); });
window.addEventListener('offline', ()=>{ isOnline=false; renderStatusPill(); });

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  await loadAll();
  render();
})();

</script>

<script>
/* ============================================================
   v47 feature layer
   ============================================================ */
(function(){
  const V47 = {
    numpad:null,
    tutorial:null,
    welcomeShown:false,
    afterRenderBusy:false
  };

  function esc47(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
  function money47(v){ return Number(v||0).toFixed(2); }
  function fileDate47(iso=new Date().toISOString()){ return dayKey(iso).replaceAll('-',''); }

  function hasExistingUsage47(){
    return !!(
      (S.archive||[]).length ||
      (S.today?.invoices||[]).length ||
      S.today?.dayOpened ||
      (S.config?.stationName && S.config.stationName!=='محطة المياه')
    );
  }

  function initConfig47(){
    let changed=false;
    if(S.config.onboardingDone===undefined){
      S.config.onboardingDone=hasExistingUsage47();
      changed=true;
    }
    if(S.config.tutorialDone===undefined){ S.config.tutorialDone=hasExistingUsage47(); changed=true; }
    if(S.config.storeLogo===undefined){ S.config.storeLogo=''; changed=true; }
    if(S.config.iconPreset===undefined){ S.config.iconPreset='ocean'; changed=true; }
    if(S.config.launcherIcon===undefined){ S.config.launcherIcon='ocean'; changed=true; }
    if(changed) persist('config');
  }

  /* ---------------- Custom numpad ---------------- */
  function closeNumpad47(){
    document.getElementById('v47-numpad-overlay')?.remove();
    V47.numpad=null;
  }

  function openNumpad47(opts){
    closeNumpad47();
    const state={
      title:opts.title||'إدخال رقم',
      value:String(opts.value??'0'),
      allowDecimal:!!opts.allowDecimal,
      onCommit:opts.onCommit
    };
    if(state.value==='NaN'||state.value==='undefined'||state.value==='null') state.value='0';
    V47.numpad=state;

    const overlay=document.createElement('div');
    overlay.id='v47-numpad-overlay';
    overlay.className='v47-numpad-overlay';
    overlay.innerHTML=`
      <div class="v47-numpad" role="dialog" aria-modal="true">
        <div class="v47-numpad-head">
          <div class="v47-numpad-title">${esc47(state.title)}</div>
          <button class="btn btn-outline" id="v47-pad-close">إغلاق</button>
        </div>
        <div class="v47-numpad-display" id="v47-pad-display">${esc47(state.value)}</div>
        <div class="v47-numpad-grid">
          ${['1','2','3','4','5','6','7','8','9'].map(n=>`<button class="v47-key" data-pad="${n}">${n}</button>`).join('')}
          <button class="v47-key action danger" data-pad="clear">مسح</button>
          <button class="v47-key" data-pad="0">0</button>
          <button class="v47-key action" data-pad="back">⌫</button>
          ${state.allowDecimal?`<button class="v47-key action" data-pad=".">.</button>`:`<button class="v47-key action" data-pad="00">00</button>`}
          <button class="v47-key action" data-pad="cancel">إلغاء</button>
          <button class="v47-key enter" data-pad="enter">إدخال ✓</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const display=()=>{ const el=document.getElementById('v47-pad-display'); if(el)el.textContent=state.value||'0'; };
    overlay.addEventListener('click',e=>{
      if(e.target===overlay){closeNumpad47();return;}
      if(e.target.closest('#v47-pad-close')){closeNumpad47();return;}
      const key=e.target.closest('[data-pad]')?.dataset.pad;
      if(!key) return;
      if(key==='cancel'){closeNumpad47();return;}
      if(key==='clear'){state.value='0';display();return;}
      if(key==='back'){
        state.value=state.value.length>1?state.value.slice(0,-1):'0';display();return;
      }
      if(key==='enter'){
        const num=Number(state.value||0);
        if(!Number.isFinite(num)){showToast('الرقم غير صحيح','error');return;}
        try{ state.onCommit?.(num); }finally{ closeNumpad47(); }
        return;
      }
      if(key==='.'){
        if(!state.allowDecimal||state.value.includes('.')) return;
        state.value=(state.value||'0')+'.';display();return;
      }
      if(key==='00'){
        state.value=state.value==='0'?'0':state.value+'00';display();return;
      }
      if(state.value==='0') state.value=key;
      else state.value+=key;
      display();
    });
  }

  function bindNumpad47(){
    document.querySelectorAll('#sales-cart-card .cart-qty-number').forEach(el=>{
      if(el.dataset.v47Bound) return;
      el.dataset.v47Bound='1';
      el.title='اضغط لكتابة الكمية';
      el.setAttribute('role','button');
      el.tabIndex=0;
      el.onclick=()=>{
        const row=el.closest('[data-cart-item-id]');
        const id=row?.dataset.cartItemId;
        const item=(S.today.cart||[]).find(x=>String(x.product.id)===String(id));
        if(!item) return;
        openNumpad47({
          title:`كمية ${item.product.name}`,
          value:item.quantity,
          allowDecimal:false,
          onCommit:(n)=>{
            const q=Math.max(0,Math.floor(n));
            if(q===0) S.today.cart=S.today.cart.filter(x=>String(x.product.id)!==String(id));
            else item.quantity=q;
            persist('today');
            updateCartQuantityDOM(id);
          }
        });
      };
    });

    document.querySelectorAll('input[type="number"]').forEach(input=>{
      if(input.dataset.v47Bound) return;
      input.dataset.v47Bound='1';
      input.inputMode='none';
      input.autocomplete='off';
      input.readOnly=true;
      const open=()=>{
        const step=String(input.getAttribute('step')||'1');
        const allowDecimal=step.includes('.')||step==='any';
        openNumpad47({
          title:input.placeholder||input.closest('label')?.childNodes?.[0]?.textContent?.trim()||'إدخال رقم',
          value:input.value||'0',
          allowDecimal,
          onCommit:(num)=>{
            let value=num;
            if(input.min!=='' && Number.isFinite(Number(input.min))) value=Math.max(Number(input.min),value);
            if(input.max!=='' && Number.isFinite(Number(input.max))) value=Math.min(Number(input.max),value);
            input.value=String(value);
            input.dispatchEvent(new Event('input',{bubbles:true}));
            input.dispatchEvent(new Event('change',{bubbles:true}));
          }
        });
      };
      input.addEventListener('click',open);
    });
  }

  window.bindNumpad47=bindNumpad47;

  /* ---------------- Welcome + tutorial ---------------- */
  function showWelcome47(){
    if(V47.welcomeShown||S.config.onboardingDone) return;
    V47.welcomeShown=true;
    const layer=document.createElement('div');
    layer.className='v47-welcome';
    layer.id='v47-welcome';
    layer.innerHTML=`
      <div class="v47-welcome-card">
        <div class="v47-welcome-logo">${icon('droplet',34)}</div>
        <h1>أهلاً بك</h1>
        <p>لنبدأ باسم المحطة. بعد ذلك يمكنك أخذ جولة تفاعلية قصيرة تشرح البيع، الشفتات، التقارير والأرشيف.</p>
        <label style="display:block;font-size:11px;font-weight:900;margin:12px 0 5px">اسم المحطة أو المتجر</label>
        <input id="v47-welcome-name" class="input-text" type="text" value="${esc47(S.config.stationName==='محطة المياه'?'':S.config.stationName)}" placeholder="مثال: مياه السيف">
        <div class="v47-welcome-actions">
          <button class="btn-success" id="v47-start-tutorial">حفظ الاسم وبدء الشرح</button>
          <button class="btn btn-outline" id="v47-skip-tutorial">حفظ الاسم وتخطي الشرح</button>
        </div>
      </div>`;
    document.body.appendChild(layer);

    const finish=(tutorial)=>{
      const name=document.getElementById('v47-welcome-name')?.value.trim();
      if(name) S.config.stationName=name;
      S.config.onboardingDone=true;
      S.config.tutorialDone=!tutorial;
      persist('config');
      layer.remove();
      V47.welcomeShown=false;
      render();
      if(tutorial) setTimeout(()=>startTutorial47(),220);
    };
    layer.querySelector('#v47-start-tutorial').onclick=()=>finish(true);
    layer.querySelector('#v47-skip-tutorial').onclick=()=>finish(false);
  }

  function tutorialSteps47(){
    const steps=[
      {
        id:'brand',
        sel:'.station-name',
        title:'هذه محطتك',
        text:'هذا اسم المتجر الذي اخترته. يمكنك تغييره لاحقاً من الإعدادات.',
        mode:'next',
        actionText:'ابدأ الجولة'
      }

    if(!S.today.dayOpened){
      steps.push({

        sel:'.sales-open-card',

        mode:'open-day',
        eventSelector:'#btn-open-day',
        actionText:'بانتظار افتتاح اليوم…'

    }

    steps.push(
      {
        id:'add-product',
        sel:'.grid-2 [data-add]',
        title:'جرّب إضافة منتج',
        text:'اضغط الآن على المنتج المضيء. سنستخدم العربة كتدريب، ولن نحفظ فاتورة تدريبية.',
        mode:'interaction',
        eventSelector:'.grid-2 [data-add]',
        actionText:'اضغط المنتج على الشاشة'
      },
      {
        id:'quantity',
        sel:'#sales-cart-card .cart-qty-number',
        title:'الكمية أصبحت أسرع',
        text:'اضغط على رقم الكمية نفسه، وليس فقط + أو −. ستظهر لوحة أرقام داخل التطبيق.',
        mode:'interaction',
        eventSelector:'#sales-cart-card .cart-qty-number',
        actionText:'اضغط رقم الكمية'
      },
      {
        id:'numpad',
        sel:'#v47-numpad-overlay .v47-numpad',
        title:'اكتب كمية كبيرة مباشرة',
        text:'جرّب كتابة 10 أو 20 ثم اضغط «إدخال ✓». هذه الطريقة تعمل مع الحقول الرقمية الأخرى أيضاً.',
        mode:'interaction',
        eventSelector:'#v47-numpad-overlay [data-pad="enter"]',
        cardPosition:'top',
        actionText:'اكتب رقماً ثم اضغط إدخال'
      },
      {
        id:'checkout',
        sel:'#btn-checkout',
        title:'تأكيد الفاتورة',
        text:'اضغط «تأكيد الفاتورة». ستظهر لك طريقة الدفع في اللحظة الأخيرة فقط.',

        eventSelector:'#btn-checkout',
        actionText:'اضغط تأكيد الفاتورة'
      },
      {
        id:'payment',
        sel:'.v49-payment-choices',
        title:'اختر طريقة الدفع',
        text:'اضغط «نقدي» أو «كليك». أثناء الدليل لن يتم حفظ هذه الفاتورة فعلياً.',
        mode:'demo-payment',
        eventSelector:'.v49-payment-choice',
        cardPosition:'top',
        actionText:'اختر نقدي أو كليك'
      },
      {
        id:'finance',
        sel:'.shift-finance-entry',
        title:'الحركات المالية',
        text:'السحوبات الشخصية والمصاريف والأجور كلها موجودة في مكان واحد، وكل حركة ترتبط بالشفت الحالي تلقائياً.',
        mode:'next',
        actionText:'فهمت'
      },
      {
        id:'inventory-tab',
        sel:'[data-tab="inventory"]',
        title:'الجرد واستلام الشفتات',
        text:'اضغط الآن «الجرد». سنجرب معاً إدخال الجرد ثم نشرح كيف يتم تسليم الشفت.',
        mode:'interaction',
        eventSelector:'[data-tab="inventory"]',
        actionText:'اضغط الجرد'
      }
    );

  function tutorialRestore47(){
    const t=V47.tutorial;
    if(!t||t.restored) return;
    t.restored=true;

    // Never keep the demo payment modal or demo cart modifications.
    if(modalState?.type==='invoice-payment-v49') modalState=null;

    if(t.originalCart){
      S.today.cart=JSON.parse(JSON.stringify(t.originalCart));
      persist('today');
    }
    if(t.originalJardInputs){
      jardInputs=JSON.parse(JSON.stringify(t.originalJardInputs));
    }else if(t.originalCustomer!==undefined){
      jardInputs.selectedCustomer=t.originalCustomer;
    }
  }

  function stopTutorial47(done=true){
    const t=V47.tutorial;
    if(t){
      clearTimeout(t.retryTimer);
      if(t.positionRaf) cancelAnimationFrame(t.positionRaf);
      teardownTutorialTracking53();
      tutorialRestore47();
    }
    document.getElementById('v47-tutorial')?.remove();

    const returnTab=t?.returnTab;
    V47.tutorial=null;

    if(done){
      S.config.tutorialDone=true;
      persist('config');
    }

    if(returnTab && returnTab!==tab){
      tab=returnTab;
      render();
    }else if(t){
      render();
    }
  }

  function tutorialTarget47(step){
    return step?.sel ? document.querySelector(step.sel) : null;
  }

  function tutorialViewport53(){
    const vv=window.visualViewport;
    return {
      left:vv?.offsetLeft||0,
      top:vv?.offsetTop||0,
      width:vv?.width||window.innerWidth,
      height:vv?.height||window.innerHeight
    };
  }

  function clamp53(v,min,max){ return Math.max(min,Math.min(max,v)); }

  function teardownTutorialTracking53(){
    const t=V47.tutorial;
    if(!t?.trackingCleanup) return;
    try{ t.trackingCleanup(); }catch(_){}
    t.trackingCleanup=null;
  }

  function scheduleTutorialPosition53(scrollTarget=false){
    const t=V47.tutorial;
    if(!t) return;
    if(t.positionRaf) cancelAnimationFrame(t.positionRaf);
    t.positionRaf=requestAnimationFrame(()=>{
      t.positionRaf=null;
      positionTutorial47(scrollTarget);
    });
  }

  function setupTutorialTracking53(){
    const t=V47.tutorial;
    if(!t) return;
    teardownTutorialTracking53();

    const rerender=()=>scheduleTutorialPosition53(false);
    const vv=window.visualViewport;
    window.addEventListener('resize',rerender,{passive:true});
    window.addEventListener('orientationchange',rerender,{passive:true});
    window.addEventListener('scroll',rerender,{passive:true,capture:true});
    vv?.addEventListener('resize',rerender,{passive:true});
    vv?.addEventListener('scroll',rerender,{passive:true});

    let ro=null;
    if('ResizeObserver' in window){
      ro=new ResizeObserver(rerender);
      const target=tutorialTarget47(t.steps[t.index]);
      const card=document.querySelector('#v47-tutorial .v47-tutorial-card');
      if(target) ro.observe(target);
      if(card) ro.observe(card);
      ro.observe(document.documentElement);
    }

    let mo=null;
    if('MutationObserver' in window){
      mo=new MutationObserver(()=>scheduleTutorialPosition53(false));
      mo.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
    }

    t.trackingCleanup=()=>{
      window.removeEventListener('resize',rerender);
      window.removeEventListener('orientationchange',rerender);
      window.removeEventListener('scroll',rerender,true);
      vv?.removeEventListener('resize',rerender);
      vv?.removeEventListener('scroll',rerender);
      ro?.disconnect();
      mo?.disconnect();
    };
  }

  function placeTutorialNow53(step,target){
    const t=V47.tutorial;
    if(!t) return;

    const root=document.getElementById('v47-tutorial');
    const spot=root?.querySelector('.v47-tutorial-spot');
    const card=root?.querySelector('.v47-tutorial-card');
    if(!spot||!card||!target) return;

    const vp=tutorialViewport53();
    const safe=10;
    const gap=12;
    const pad=8;
    const r=target.getBoundingClientRect();

    // Spotlight is always calculated from the CURRENT real element rectangle.
    const left=clamp53(r.left-pad,vp.left+6,vp.left+vp.width-50);
    const top=clamp53(r.top-pad,vp.top+6,vp.top+vp.height-50);
    const right=clamp53(r.right+pad,left+44,vp.left+vp.width-6);
    const bottom=clamp53(r.bottom+pad,top+44,vp.top+vp.height-6);

    Object.assign(spot.style,{
      left:`${left}px`,
      top:`${top}px`,
      width:`${Math.max(44,right-left)}px`,
      height:`${Math.max(44,bottom-top)}px`
    });

    spot.classList.toggle('interactive',
      ['interaction','demo-payment','open-day','demo-jard-save','demo-handoff-open','demo-handoff-confirm'].includes(step.mode)
    );

    // Position the tutorial card intelligently so it doesn't sit over the target.
    card.style.left='0';
    card.style.right='auto';
    card.style.top='0';
    card.style.bottom='auto';
    card.style.maxWidth=`${Math.min(430,vp.width-safe*2)}px`;

    const cardRect=card.getBoundingClientRect();
    const cw=Math.min(cardRect.width||360,vp.width-safe*2);
    const ch=Math.min(cardRect.height||210,vp.height-safe*2);

    const availBelow=(vp.top+vp.height)-(r.bottom+gap);
    const availAbove=(r.top-gap)-vp.top;
    const availRight=(vp.left+vp.width)-(r.right+gap);
    const availLeft=(r.left-gap)-vp.left;

    let cx=vp.left+(vp.width-cw)/2;
    let cy=vp.top+safe;
    let placement='top';

    // Wide landscape/tablet: prefer a side card if it fits.
    if(vp.width>=700 && availRight>=cw+safe){
      cx=r.right+gap;
      cy=clamp53(r.top+(r.height-ch)/2,vp.top+safe,vp.top+vp.height-ch-safe);
      placement='right';
    }else if(vp.width>=700 && availLeft>=cw+safe){
      cx=r.left-gap-cw;
      cy=clamp53(r.top+(r.height-ch)/2,vp.top+safe,vp.top+vp.height-ch-safe);
      placement='left';
    }else if(availBelow>=ch+safe){
      cx=clamp53(r.left+(r.width-cw)/2,vp.left+safe,vp.left+vp.width-cw-safe);
      cy=r.bottom+gap;
      placement='below';
    }else if(availAbove>=ch+safe){
      cx=clamp53(r.left+(r.width-cw)/2,vp.left+safe,vp.left+vp.width-cw-safe);
      cy=r.top-gap-ch;
      placement='above';
    }else{
      // Extremely short landscape: choose the edge with the least overlap.
      const targetMid=r.top+r.height/2;
      const viewportMid=vp.top+vp.height/2;
      cy=targetMid>viewportMid ? vp.top+safe : vp.top+vp.height-ch-safe;
      cx=clamp53(vp.left+(vp.width-cw)/2,vp.left+safe,vp.left+vp.width-cw-safe);
      placement=targetMid>viewportMid?'top-edge':'bottom-edge';
    }

    Object.assign(card.style,{
      left:`${Math.round(cx)}px`,
      top:`${Math.round(cy)}px`,
      width:`${Math.round(cw)}px`
    });
    card.dataset.placement=placement;
  }

  function positionTutorial47(scrollTarget=true){
    const t=V47.tutorial;
    if(!t) return;
    const step=t.steps[t.index];
    if(!step) return;

    const target=tutorialTarget47(step);
    if(!target){
      clearTimeout(t.retryTimer);
      t.retryTimer=setTimeout(()=>positionTutorial47(true),120);
      return;
    }

    const doPlace=()=>{
      if(!V47.tutorial || V47.tutorial.steps[V47.tutorial.index]?.id!==step.id) return;
      const live=tutorialTarget47(step);
      if(!live) return;
      requestAnimationFrame(()=>placeTutorialNow53(step,live));
    };

    if(scrollTarget){
      const rect=target.getBoundingClientRect();
      const vp=tutorialViewport53();
      const visible=rect.bottom>vp.top+56 && rect.top<vp.top+vp.height-70;
      if(!visible){
        target.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
        setTimeout(doPlace,260);
      }else{
        doPlace();
      }
    }else{
      doPlace();
    }
  }

  function advanceTutorial47(){
    const t=V47.tutorial;
    if(!t) return;

    if(t.index>=t.steps.length-1){
      stopTutorial47(true);
      return;
    }
    t.index++;
    showTutorialStep47();
  }

  function showTutorialStep47(){
    const t=V47.tutorial;
    if(!t) return;

    const step=t.steps[t.index];
    const root=document.getElementById('v47-tutorial');
    if(!root||!step) return;

    const card=root.querySelector('.v47-tutorial-card');
    card.classList.toggle('v50-card-top',step.cardPosition==='top');

    const interactive=['interaction','demo-payment','open-day','demo-jard-save','demo-handoff-open','demo-handoff-confirm'].includes(step.mode);
    const isFinish=step.mode==='finish';

    card.innerHTML=`
      <div class="v50-tutorial-topline">
        <span class="v50-tutorial-step">الخطوة ${t.index+1} من ${t.steps.length}</span>
        <span class="v50-tutorial-mode ${interactive?'live':''}">${interactive?'تفاعلي':'شرح'}</span>
      </div>
      <div class="v47-tutorial-progress"><span style="width:${((t.index+1)/t.steps.length)*100}%"></span></div>
      <h3>${esc47(step.title)}</h3>
      <p>${esc47(step.text)}</p>
      ${interactive?`<div class="v50-tutorial-live"><span class="v50-live-dot"></span>${esc47(step.actionText||'نفّذ الخطوة على الشاشة')}</div>`:''}
      <div class="v47-tutorial-actions">
        <button class="btn btn-outline" id="v47-tutorial-skip">تخطي الدليل</button>
        ${interactive
          ? `<button class="btn v50-wait-btn" type="button" disabled>${esc47(step.actionText||'بانتظار التنفيذ…')}</button>`
          : `<button class="btn btn-action v50-tutorial-action" id="v47-tutorial-next">${esc47(isFinish?'إنهاء':(step.actionText||'التالي'))}</button>`
        }
      </div>`;

    card.querySelector('#v47-tutorial-skip')?.addEventListener('click',()=>stopTutorial47(true));
    card.querySelector('#v47-tutorial-next')?.addEventListener('click',()=>{
      if(isFinish) stopTutorial47(true);
      else advanceTutorial47();
    });

    setupTutorialTracking53();
    scheduleTutorialPosition53(true);
  }

  function rebuildTutorialAfterOpen47(){
    const t=V47.tutorial;
    if(!t||!S.today.dayOpened) return;

    t.steps=tutorialSteps47();
    // Brand is step 0; after the real day is opened continue at add-product.
    t.index=Math.min(1,t.steps.length-1);
    showTutorialStep47();
  }

  function startTutorial47(){
    stopTutorial47(false);

    const returnTab=tab;
    const originalCart=JSON.parse(JSON.stringify(S.today.cart||[]));
    const originalCustomer=jardInputs.selectedCustomer;
    const originalJardInputs=JSON.parse(JSON.stringify(jardInputs||{}));

    tab='sales';
    render();

    setTimeout(()=>{
      const steps=tutorialSteps47();
      V47.tutorial={
        steps,
        index:0,
        returnTab,
        originalCart,
        originalCustomer,
        originalJardInputs,
        restored:false,
        retryTimer:null,
        positionRaf:null,
        trackingCleanup:null
      };

      const root=document.createElement('div');
      root.id='v47-tutorial';
      root.className='v47-tutorial-layer v50-tutorial-layer';
      root.innerHTML=`<div class="v47-tutorial-spot"></div><div class="v47-tutorial-card"></div>`;
      document.body.appendChild(root);

      showTutorialStep47();
    },140);
  }
  window.startTutorial47=startTutorial47;

  // Capture tutorial actions before the app's normal handlers when necessary.
  document.addEventListener('click',(event)=>{
    const t=V47.tutorial;
    if(!t) return;

    const step=t.steps[t.index];
    if(!step?.eventSelector) return;

    const hit=event.target.closest(step.eventSelector);
    if(!hit) return;

    if(step.mode==='demo-payment'){
      // Demonstrate the real payment screen but do NOT save a training invoice.
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      modalState=null;
      render();
      setTimeout(()=>advanceTutorial47(),100);
      return;
    }

    if(step.mode==='demo-jard-save'){
      // Never write a tutorial inventory count to today's real inventory record.
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      showToast('تدريب: هكذا يتم حفظ الجرد — لم يتم تغيير السجل');
      if(step.id==='jard-save-demo'){
        tab='sales';
        render();
      }else{
        render();
      }
      setTimeout(()=>advanceTutorial47(),140);
      return;
    }

    if(step.mode==='demo-handoff-open'){
      // Open the real handoff form for training without requiring/persisting a demo jard.
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      modalState={type:'close-morning-shift',tutorialDemo:true};
      render();
      setTimeout(()=>advanceTutorial47(),160);
      return;
    }

    if(step.mode==='demo-handoff-confirm'){
      // Explain/complete the handoff flow without actually changing the active shift.
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      modalState=null;
      showToast('تدريب: تم شرح تسليم الشفت — لم يتم تغيير الشفت الحقيقي');
      tab='inventory';
      render();
      setTimeout(()=>advanceTutorial47(),160);
      return;
    }

    if(step.id==='open-day'){
      // Let the normal open-day handler run first.
      setTimeout(()=>{
        if(S.today.dayOpened) rebuildTutorialAfterOpen47();
        else showTutorialStep47();
      },260);
      return;
    }

    // For product, quantity, numpad, checkout and navigation:
    // allow the real UI action, then advance automatically.
    setTimeout(()=>advanceTutorial47(),step.id==='checkout'?180:100);
  },true);

  function dayMetrics47(day){
    const invoices=(day.invoices||[]).filter(i=>!i.cancelled);
    const totalSales=invoices.reduce((s,i)=>s+Number(i.total||0),0);
    const cashSales=invoices.filter(i=>(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0);
    const clickSales=invoices.filter(i=>(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0);
    const totalCost=invoices.reduce((sum,inv)=>sum+(inv.items||[]).reduce((s,it)=>s+Number(it.product?.cost||0)*Number(it.quantity||0),0),0);
    const draws=(day.draws||[]).reduce((s,x)=>s+Number(x.amount||0),0);
    const expenses=(day.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0);
    const wages=(day.wages||[]).reduce((s,x)=>s+Number(x.hours||0)*Number(x.rate||0),0);
    const gross=totalSales-totalCost;
    const net=gross-expenses-wages;
    return {totalSales,cashSales,clickSales,totalCost,draws,expenses,wages,gross,net};
  }

  function periodDays47(mode){
    const cal=ensureCalState();
    const today=new Date();
    const days=[...(S.archive||[])];
    const current=snapshotDay47();
    if((S.today.invoices||[]).length || (S.today.draws||[]).length || (S.today.expenses||[]).length || (S.today.wages||[]).length) days.push(current);

    return days.filter(day=>{
      const d=new Date(day.date);
      if(mode==='month') return d.getFullYear()===cal.year && d.getMonth()===cal.month;
      return d.getFullYear()===cal.year;
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  }

  function workbookSheets47(mode){
    const days=periodDays47(mode);
    const daily=[],shifts=[],products=[],expenses=[],draws=[],wages=[];

    for(const day of days){
      const m=dayMetrics47(day);
      const date=dayKey(day.date);
      daily.push({
        'التاريخ':date,'إجمالي المبيعات':m.totalSales,'النقدي':m.cashSales,'كليك':m.clickSales,
        'تكلفة البضاعة':m.totalCost,'إجمالي الربح':m.gross,'المصاريف':m.expenses,
        'الأجور':m.wages,'السحوبات الشخصية':m.draws,'صافي الربح':m.net,
        'كوبونات صباحي':shiftCouponCount('صباحي',day),'كوبونات مسائي':shiftCouponCount('مسائي',day),
        'عدد الفواتير':(day.invoices||[]).filter(i=>!i.cancelled).length
      });
      for(const shift of ['صباحي','مسائي']){
        const st=shiftTotals(shift,day);
        shifts.push({
          'التاريخ':date,'الشفت':shift,'المبيعات':st.totalSales,'النقدي':st.cashSales,'كليك':st.clickSales,
          'المصاريف':st.totalExpenses,'الأجور':st.totalWages,'السحوبات':st.totalDraws,
          'العهدة':st.openingCash,'الكاش المتوقع':st.expectedCash,'الكاش الفعلي':st.actualCash??'',
          'فرق الصندوق':st.cashDiff??'','الكوبونات':st.couponCount,'الفواتير':st.invoiceCount
        });
      }
      for(const inv of (day.invoices||[]).filter(i=>!i.cancelled)){
        for(const it of (inv.items||[])){
          const qty=Number(it.quantity||0);
          const unit=effectiveUnitPrice(it.product,qty);
          products.push({
            'التاريخ':date,'الشفت':inv.shift||'صباحي','الفاتورة':inv.id||'','المنتج':it.product?.name||'منتج',
            'الكمية':qty,'سعر الوحدة':unit,'الإجمالي':unit*qty,'طريقة الدفع':inv.paymentMethod||'نقدي'
          });
        }
      }
      for(const x of day.expenses||[]) expenses.push({'التاريخ':date,'الشفت':x.shift||'صباحي','البيان':x.desc||'','القيمة':Number(x.amount||0)});
      for(const x of day.draws||[]) draws.push({'التاريخ':date,'الشفت':x.shift||'صباحي','البيان':x.desc||'','القيمة':Number(x.amount||0)});
      for(const x of day.wages||[]) wages.push({'التاريخ':date,'الشفت':x.shift||'صباحي','العامل':x.name||'','الساعات':Number(x.hours||0),'الأجر/ساعة':Number(x.rate||0),'الإجمالي':Number(x.hours||0)*Number(x.rate||0)});
    }
    return {
      'الملخص اليومي':daily,
      'الشفتات':shifts,
      'المبيعات حسب الصنف':products,
      'المصاريف':expenses,
      'السحوبات':draws,
      'الأجور':wages
    };
  }

  async function exportExcel47(mode){
    if(!window.NativeTools?.saveWorkbook){
      showToast('تصدير Excel متاح داخل نسخة APK','error');return;
    }
    const cal=ensureCalState();
    const sheets=workbookSheets47(mode);
    const count=Object.values(sheets)[0]?.length||0;
    if(!count){showToast('لا توجد بيانات للفترة المحددة','error');return;}
    const fileName=mode==='month'
      ? `water-${cal.year}-${String(cal.month+1).padStart(2,'0')}.xlsx`
      : `water-${cal.year}.xlsx`;
    try{
      const result=await window.NativeTools.saveWorkbook({sheets,fileName});
      showToast(`تم حفظ Excel في التنزيلات: ${result?.name||fileName}`);
    }catch(err){console.error(err);showToast('تعذر تصدير Excel','error');}
  }
