<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>محطة المياه — V55</title>
<!-- Tajawal is now self-hosted via @fontsource/tajawal (see src/native-bridge.js) so the app renders the correct font even fully offline. -->
<style>

  :root{
    --accent:#0891b2;
    --accent-dark:#0e7490;
    --accent-light:#cffafe;
    --bg:#f2f8f9;
    --card:#ffffff;
    --ink:#0f2a30;
    --muted:#4a6b70;
    --border:#dde9eb;
    --success:#059669;
    --warning:#d97706;
    --danger:#dc2626;
    --radius:16px;
    --font-scale:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    justify-content:center;
    font-size:calc(14px * var(--font-scale));
  }
  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:84px;
    box-shadow:0 0 40px rgba(15,42,48,.08);
  }

  /* ---------- Header (wave signature) ---------- */
  .topbar{
    position:relative;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    color:#fff;
    padding:18px 18px 34px 18px;
    overflow:hidden;
  }
  .topbar .wave{
    position:absolute; left:0; right:0; bottom:-1px; line-height:0;
  }
  .topbar .wave svg{width:100%;height:28px;display:block;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:2;}
  .station-name{font-size:calc(19px * var(--font-scale));font-weight:900;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .status-pill{
    display:flex;align-items:center;gap:6px;
    font-size:calc(10.5px * var(--font-scale));
    font-weight:700;
    background:rgba(255,255,255,.16);
    padding:5px 10px;border-radius:100px;
    backdrop-filter:blur(4px);
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulseDot 2s infinite;}
  .status-dot.off{background:#fca5a5;animation:none;}
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(52,211,153,.55);}
    70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}
    100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
  }
  .worker-chip{
    margin-top:12px;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    padding:8px 10px;border-radius:12px;position:relative;z-index:2;
  }
  .worker-chip input{
    background:transparent;border:none;color:#fff;font-weight:700;
    font-family:inherit;font-size:calc(12.5px*var(--font-scale));outline:none;flex:1;text-align:right;
  }
  .worker-chip input::placeholder{color:rgba(255,255,255,.7);}

  main{flex:1;padding:16px;padding-top:14px;}

  /* ---------- Generic ---------- */
  .card{
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:0 1px 3px rgba(15,42,48,.04);
    margin-bottom:14px;
    text-align:right;
    animation:riseIn .35s ease both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  h2.section-title{margin:0;font-size:calc(15.5px*var(--font-scale));font-weight:900;display:flex;align-items:center;gap:8px;}
  h3.sub-title{margin:0 0 10px 0;font-size:calc(12.5px*var(--font-scale));color:var(--muted);font-weight:700;}
  .muted{color:var(--muted);}
  .icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .btn-prod{
    background:var(--card);border:1px solid var(--border);padding:12px;border-radius:14px;
    text-align:right;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
    height:88px;box-sizing:border-box;transition:.15s ease;font-family:inherit;
    animation:riseIn .35s ease both;
  }
  .btn-prod:active{transform:scale(.95);border-color:var(--accent);background:var(--accent-light);}
  .prod-name{font-weight:700;font-size:calc(12px*var(--font-scale));color:var(--ink);}
  .prod-tag{font-size:calc(9.5px*var(--font-scale));background:var(--bg);padding:2px 6px;border-radius:6px;color:var(--muted);}
  .prod-price{font-weight:900;color:var(--accent-dark);font-size:calc(12.5px*var(--font-scale));}

  .btn{
    border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;transition:.15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-action{background:var(--accent);color:#fff;padding:9px 13px;font-size:calc(11.5px*var(--font-scale));}
  .btn-amber{background:var(--warning);color:#fff;}
  .coupon-btn{min-height:48px;padding:12px 18px;border-radius:14px;font-size:calc(13px*var(--font-scale));font-weight:900;justify-content:center;box-shadow:0 7px 16px -7px rgba(217,119,6,.7);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .coupon-btn .icon{width:19px!important;height:19px!important;}
  .coupon-btn:active{transform:scale(.94);box-shadow:0 3px 8px -4px rgba(217,119,6,.7);}
  @media (max-width:360px){.coupon-btn{padding:11px 13px;font-size:calc(12px*var(--font-scale));}}
  .btn-gray{background:#64748b;color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 12px;font-size:calc(11px*var(--font-scale));}
  .btn-success{
    background:linear-gradient(135deg,var(--success),#10b981);color:#fff;width:100%;border:none;
    padding:13px;border-radius:12px;font-weight:800;cursor:pointer;font-size:calc(13px*var(--font-scale));
    display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;
    box-shadow:0 6px 14px -6px rgba(5,150,105,.5);
  }
  .btn-success:active{transform:scale(.97);}
  .btn-icon-only{padding:8px;border-radius:8px;}

  .input-text{
    width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
    box-sizing:border-box;font-size:calc(12px*var(--font-scale));font-weight:700;font-family:inherit;color:var(--ink);
  }
  .input-text:focus{outline:2px solid var(--accent);outline-offset:1px;}

  table{width:100%;border-collapse:collapse;font-size:calc(11.5px*var(--font-scale));margin-top:8px;}
  th,td{border:1px solid var(--border);padding:7px;text-align:center;}
  th{background:var(--bg);color:var(--muted);font-weight:700;}
  tr.deficit-row td{background:#fef2f2;color:var(--danger);font-weight:900;animation:rowPulse 1.8s infinite;}
  @keyframes rowPulse{0%,100%{background:#fef2f2;}50%{background:#fee2e2;}}

  .toast{
    position:fixed;top:14px;left:14px;right:14px;max-width:400px;margin:0 auto;background:var(--card);
    padding:12px 14px;border-radius:12px;box-shadow:0 10px 24px -6px rgba(15,42,48,.25);
    display:flex;align-items:center;z-index:500;font-size:calc(12px*var(--font-scale));font-weight:700;
    border-right:4px solid var(--success);animation:toastIn .3s ease both;gap:8px;
  }
  .toast.error{border-right-color:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

  .nav-bar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    height:68px;display:flex;justify-content:space-around;align-items:center;max-width:430px;margin:0 auto;
    box-shadow:0 -6px 16px rgba(15,42,48,.05);z-index:100;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#9fb3b6;
    font-size:calc(10px*var(--font-scale));font-weight:700;gap:4px;flex:1;background:none;border:none;
    font-family:inherit;cursor:pointer;padding:8px 0;position:relative;transition:.2s;
  }
  .nav-item.active{color:var(--accent-dark);}
  .nav-item.active::after{
    content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);
    animation:navIn .25s ease both;
  }
  @keyframes navIn{from{width:0;}to{width:26px;}}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);
    font-size:calc(12px*var(--font-scale));gap:8px;padding:24px 0;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,42,48,.55);z-index:600;display:flex;align-items:center;
    justify-content:center;padding:18px;animation:fadeIn .2s ease both;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--card);border-radius:18px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;
    padding:20px;animation:modalIn .25s cubic-bezier(.2,1,.3,1) both;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  .deficit-banner{
    background:linear-gradient(135deg,#dc2626,#f87171);color:#fff;border-radius:16px;padding:16px;
    display:flex;align-items:center;gap:12px;margin-bottom:14px;animation:bannerPulse 1.6s infinite,riseIn .35s ease both;
    box-shadow:0 8px 20px -8px rgba(220,38,38,.6);
  }
  @keyframes bannerPulse{0%,100%{box-shadow:0 8px 20px -8px rgba(220,38,38,.6);}50%{box-shadow:0 8px 26px -4px rgba(220,38,38,.85);}}
  .deficit-banner .icon-wrap{
    width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;
  }

  .surplus-banner{background:linear-gradient(135deg,var(--success),#34d399);box-shadow:0 8px 20px -8px rgba(5,150,105,.55);animation:riseIn .35s ease both;}

  .theme-swatch{
    width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .theme-swatch.selected{border-color:var(--ink);transform:scale(1.08);}
  .shade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .shade-field{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:800;color:var(--muted);}
  .shade-field input[type=color]{width:100%;height:38px;border:0;padding:0;background:transparent;cursor:pointer;border-radius:8px;}
  .theme-preview{height:52px;border-radius:13px;background:linear-gradient(135deg,var(--accent-dark),var(--accent));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;box-shadow:0 8px 18px -10px var(--accent-dark);}

  .fs-btn{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;
    font-family:inherit;font-weight:700;font-size:12px;color:var(--muted);
  }
  .fs-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg);}
  .list-row:last-child{border-bottom:none;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0;
  }
  .cal-nav-btn:active{transform:scale(.92);}
  .cal-title{font-weight:900;font-size:calc(13.5px*var(--font-scale));display:flex;align-items:center;gap:6px;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .cal-weekdays span{text-align:center;font-size:calc(9.5px*var(--font-scale));color:var(--muted);font-weight:800;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{
    aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:calc(11px*var(--font-scale));font-weight:700;color:var(--ink);background:var(--bg);
    cursor:default;position:relative;border:1.5px solid transparent;transition:.15s;
  }
  .cal-cell.empty{background:transparent;}
  .cal-cell.has-data{cursor:pointer;background:#f0fdf4;color:#166534;}
  .cal-cell.has-data.deficit{background:#fef2f2;color:var(--danger);}
  .cal-cell.has-data:active{transform:scale(.92);}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.selected{background:var(--accent) !important;color:#fff !important;border-color:var(--accent-dark);}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:2px;}
  .cal-legend{display:flex;gap:14px;margin-top:12px;font-size:calc(10px*var(--font-scale));color:var(--muted);flex-wrap:wrap;}
  .cal-legend-item{display:flex;align-items:center;gap:5px;}
  .cal-legend-dot{width:9px;height:9px;border-radius:3px;}

  ::-webkit-scrollbar{width:0;height:0;}


  /* ---------- Commercial dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:13px;box-shadow:0 4px 14px rgba(15,42,48,.05);position:relative;overflow:hidden;animation:riseIn .35s ease both;}
  .kpi:before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--accent);}
  .kpi-label{font-size:calc(10.5px*var(--font-scale));color:var(--muted);font-weight:700;}
  .kpi-value{font-size:calc(18px*var(--font-scale));font-weight:900;margin-top:5px;color:var(--ink);}
  .kpi-note{font-size:calc(9.5px*var(--font-scale));color:var(--muted);margin-top:3px;}
  .cash-match{border-radius:16px;padding:15px;margin-bottom:14px;border:1px solid var(--border);background:linear-gradient(145deg,var(--card),var(--bg));}
  .cash-result{padding:10px 12px;border-radius:11px;font-weight:900;display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .cash-result.ok{background:#ecfdf5;color:#065f46}.cash-result.bad{background:#fef2f2;color:#991b1b}.cash-result.warn{background:#fff7ed;color:#9a3412}
  .mini-bars{display:flex;align-items:flex-end;gap:7px;height:100px;padding-top:12px;}
  .mini-bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
  .mini-bar{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent-dark));min-height:4px;transition:.4s ease;}
  .mini-bar-label{font-size:9px;color:var(--muted);white-space:nowrap;}
  .backup-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .brand-sub{font-size:calc(10px*var(--font-scale));opacity:.78;margin-top:3px;}
  @media(min-width:390px){.kpi-grid{grid-template-columns:repeat(4,1fr)}.kpi{padding:11px}.kpi-value{font-size:calc(15px*var(--font-scale));}}


  .audit-row{padding:9px 0;border-bottom:1px solid var(--bg);font-size:calc(10.5px*var(--font-scale));}
  .invoice-cancelled{opacity:.68;background:#f8fafc!important;border-style:dashed!important;}
  .cancel-badge{background:#fee2e2;color:#991b1b;padding:3px 7px;border-radius:99px;font-size:9px;font-weight:900;}
  .stock-alert{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;margin-bottom:8px;font-size:11px;font-weight:700;}
  .search-box{display:flex;gap:7px;align-items:center;margin-bottom:10px;}
  .receipt-only{display:none;}
  @media print{
    body.receipt-print *{visibility:hidden!important;}
    body.receipt-print #receipt-print-area,body.receipt-print #receipt-print-area *{visibility:visible!important;}
    body.receipt-print #receipt-print-area{display:block!important;position:absolute;right:0;top:0;width:58mm;padding:3mm;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:10px;direction:rtl;}
  }

  @media print{
    .nav-bar,.print-hidden,button,input,.modal-overlay .btn-outline{display:none !important;}
    .app{box-shadow:none;max-width:100%;padding-bottom:0;}
    body{background:#fff;}
  }

/* Tablet and Landscape support */
@media (min-width:600px){
  .app{max-width:900px;width:100%;}
  main{padding:22px;}
  .grid-2{grid-template-columns:repeat(3,1fr);gap:14px;}
  .btn-prod{height:110px;padding:16px;}
  .prod-name{font-size:calc(15px * var(--font-scale));}
  .prod-price{font-size:calc(15px * var(--font-scale));}
  .nav-bar{max-width:900px;}
}

@media (min-width:700px) and (orientation:landscape){
  .app{max-width:1200px;}
  .topbar{padding-left:30px;padding-right:30px;}
  .grid-2{grid-template-columns:repeat(4,1fr);}
  #sales-cart-card{min-height:220px;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .nav-bar{height:76px;max-width:1200px;}
  .nav-item{font-size:calc(13px * var(--font-scale));}
}


/* ---------- v13 Business Suite ---------- */
.customer-row,.maintenance-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg)}
.due-now{background:#fef2f2!important;border-color:#fecaca!important;color:#991b1b}
.due-soon{background:#fff7ed!important;border-color:#fed7aa!important;color:#9a3412}
@media(min-width:700px){.admin-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sales-wide-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:16px}.sales-wide-layout .grid-2{grid-column:1}.sales-wide-layout #sales-cart-card{grid-column:2;grid-row:1/4;position:sticky;top:16px;align-self:start}.sales-wide-layout .sales-head,.sales-wide-layout .sales-shift,.sales-wide-layout .sales-cash,.sales-wide-layout .sales-coupon{grid-column:1}.nav-bar{overflow-x:auto}.nav-item{min-width:92px}}



/* v15 Simple POS overrides */
:root{--radius:12px;}
body{background:#eef2f5;}
.app{max-width:1280px;background:#f5f7f9;box-shadow:none;}
.topbar{padding:14px 20px 26px;background:var(--accent-dark);}
.topbar .wave{display:none;}
.card{border-radius:12px;box-shadow:none;border-color:#dfe6e9;margin-bottom:12px;animation:none;}
.btn,.btn-prod,.input-text{transition:background .12s,border-color .12s,transform .08s;}
.btn-prod{box-shadow:none;height:96px;background:#fff;}
.btn-prod:hover{border-color:var(--accent);}
.nav-bar{max-width:1280px;height:72px;box-shadow:0 -2px 10px rgba(15,42,48,.08);}
.nav-item{font-size:11px;}
.nav-item.active::after{height:4px;width:34px;}
.switch{position:relative;display:inline-block;width:52px;height:30px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:'';position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(-22px)}
@media(min-width:700px){
  main{padding:18px 22px 92px;}
  .page-sales{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.75fr);gap:14px;align-items:start;}
  .page-sales>div:nth-child(1),.page-sales>div:nth-child(2),.page-sales>div:nth-child(3),.page-sales>div:nth-child(6){grid-column:1/-1;}
  .page-sales>.grid-2{grid-column:1;grid-row:4 / span 2;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;align-content:start;}
  .page-sales>#sales-cart-card{grid-column:2;grid-row:4;position:sticky;top:12px;min-height:430px;max-height:calc(100vh - 120px);overflow:auto;}
  .page-sales>div:nth-child(6){grid-column:2;grid-row:5;position:sticky;top:455px;}
  .page-report,.page-inventory,.page-archive,.page-settings{max-width:1050px;margin:0 auto;}
  .page-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;}
  .page-settings>.card{margin-bottom:0;}
  .page-settings>div:first-child{grid-column:1/-1;}
}
@media(min-width:1000px) and (orientation:landscape){
  .page-sales>.grid-2{grid-template-columns:repeat(4,minmax(0,1fr));}
  .btn-prod{height:108px;}
}
@media(max-width:699px){

:root{
  --native-safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --native-safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --native-safe-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  --native-safe-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
}
html.capacitor-native .topbar{
  padding-top:calc(10px + var(--native-safe-top))!important;
  padding-left:calc(14px + var(--native-safe-left))!important;
  padding-right:calc(14px + var(--native-safe-right))!important;
}
html.capacitor-native .nav-bar{
  padding-left:var(--native-safe-left)!important;
  padding-right:var(--native-safe-right)!important;
  padding-bottom:max(4px,var(--native-safe-bottom))!important;
  height:calc(72px + var(--native-safe-bottom))!important;
}
html.capacitor-native main{
  padding-bottom:calc(92px + var(--native-safe-bottom))!important;
}
html.capacitor-native.keyboard-open .nav-bar{
  opacity:0;
  pointer-events:none;
  transform:translateY(110%);
}
html.capacitor-native .nav-bar{
  transition:transform .16s ease-out, opacity .16s ease-out;
}
html.capacitor-native .native-press{
  transform:scale(.965)!important;
  opacity:.82!important;
}


/* ============================================================
   v47 — in-app numpad, onboarding, exports and native share UI
   ============================================================ */

/* ---------- In-app numeric keypad ---------- */
.v47-numpad-overlay{
  position:fixed;inset:0;z-index:1200;background:rgba(15,42,48,.22);
  display:flex;align-items:flex-end;justify-content:center;
  animation:v47Fade .14s ease-out both;
}
.v47-numpad{
  width:min(430px,100%);background:#fff;border-radius:22px 22px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -18px 45px rgba(15,42,48,.18);
  animation:v47PadUp .18s cubic-bezier(.2,.8,.25,1) both;
}
.v47-numpad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.v47-numpad-title{font-size:12px;font-weight:900;color:var(--muted)}
.v47-numpad-display{
  background:#f3f8f9;border:1px solid var(--border);border-radius:13px;padding:10px 12px;
  min-height:46px;display:flex;align-items:center;justify-content:flex-end;
  direction:ltr;font-variant-numeric:tabular-nums;font-size:24px;font-weight:900;color:var(--ink);
  overflow:hidden;
}
.v47-numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.v47-key{
  min-height:54px;border:none;border-radius:14px;background:#edf4f5;color:var(--ink);
  font-family:inherit;font-size:20px;font-weight:900;cursor:pointer;
  transition:transform .06s ease-out,background .08s ease-out,opacity .08s ease-out;
}
.v47-key:active{transform:scale(.96);opacity:.82}
.v47-key.action{font-size:13px;background:#e2ecee;color:var(--muted)}
.v47-key.enter{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff}
.v47-key.danger{background:#fef2f2;color:#b91c1c}
.cart-qty-number{
  cursor:pointer;border-radius:8px;padding:4px 7px;min-width:34px!important;
  border:1px dashed rgba(14,116,144,.35);background:#fff;
}
.cart-qty-number:active{background:var(--accent-light)}

/* ---------- Welcome / first-run onboarding ---------- */
.v47-welcome{
  position:fixed;inset:0;z-index:1400;background:
    radial-gradient(circle at 85% 5%,rgba(207,250,254,.35),transparent 30%),
    linear-gradient(155deg,#0e7490,#083344 75%);
  color:#fff;display:flex;align-items:center;justify-content:center;
  padding:20px calc(18px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(18px + env(safe-area-inset-left,0px));
}
.v47-welcome-card{
  width:min(470px,100%);background:rgba(255,255,255,.98);color:var(--ink);
  border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.24);
}
.v47-welcome-logo{
  width:72px;height:72px;margin:0 auto 12px;border-radius:21px;
  background:linear-gradient(145deg,var(--accent-dark),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 12px 30px rgba(8,145,178,.24);
}
.v47-welcome h1{margin:0;text-align:center;font-size:22px}
.v47-welcome p{font-size:12px;line-height:1.75;color:var(--muted);text-align:center}
.v47-welcome-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
.v47-welcome-actions .btn{width:100%;justify-content:center;min-height:48px}

/* ---------- Tutorial spotlight ---------- */
.v47-tutorial-layer{position:fixed;inset:0;z-index:1350;pointer-events:none}
.v47-tutorial-dim{position:absolute;inset:0;background:rgba(5,25,30,.66);pointer-events:auto}
.v47-tutorial-spot{
  position:fixed;border:3px solid #67e8f9;border-radius:16px;
  box-shadow:0 0 0 9999px rgba(5,25,30,.66),0 0 0 6px rgba(103,232,249,.15);
  transition:all .24s cubic-bezier(.2,.75,.25,1);pointer-events:none;
}
.v47-tutorial-card{
  position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));
  max-width:430px;margin:0 auto;background:#fff;border-radius:18px;padding:15px;
  color:var(--ink);box-shadow:0 18px 46px rgba(0,0,0,.28);pointer-events:auto;
}
.v47-tutorial-card h3{margin:0 0 6px;font-size:15px}
.v47-tutorial-card p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.65}
.v47-tutorial-actions{display:flex;gap:8px;margin-top:12px}
.v47-tutorial-actions .btn{flex:1;justify-content:center}
.v47-tutorial-progress{height:4px;background:#e5eef0;border-radius:99px;overflow:hidden;margin-bottom:10px}
.v47-tutorial-progress span{display:block;height:100%;background:var(--accent);transition:width .2s ease}

/* ---------- Native export buttons ---------- */
.v47-action-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.v47-action-row .btn{min-height:37px}
.v47-export-card{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;
}
.v47-export-card .btn{justify-content:center;min-height:44px}

/* ---------- Compact image summary (render target) ---------- */
.v47-share-card{
  width:720px;background:#fff;color:#0f2a30;padding:38px;direction:rtl;
  font-family:'Tajawal',Arial,sans-serif;border:1px solid #dce8ea;
}
.v47-share-brand{text-align:center;border-bottom:3px solid #0891b2;padding-bottom:16px;margin-bottom:18px}
.v47-share-brand h2{margin:0;font-size:28px}.v47-share-brand div{color:#5b7c82;margin-top:6px;font-size:15px}
.v47-share-row{
  display:flex;justify-content:space-between;align-items:center;padding:15px 4px;
  border-bottom:1px solid #e4edef;font-size:21px;
}
.v47-share-row b{font-size:24px;font-variant-numeric:tabular-nums}
.v47-share-net{
  margin-top:18px;background:#ecfdf5;color:#065f46;border:2px solid #a7f3d0;
  border-radius:16px;padding:18px;display:flex;justify-content:space-between;
  font-size:24px;font-weight:900;
}
.v47-offscreen{
  position:fixed!important;left:-10000px!important;top:0!important;
  z-index:-1!important;opacity:1!important;pointer-events:none!important;
}

/* ---------- Settings enhancements ---------- */
.v47-logo-preview{
  width:70px;height:70px;border-radius:18px;background:var(--bg);border:1px solid var(--border);
  object-fit:contain;display:block;
}
.v47-setting-note{
  background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:10px;
  color:var(--muted);font-size:10px;line-height:1.6;
}
.v47-icon-presets{display:flex;gap:8px;flex-wrap:wrap}
.v47-icon-preset{
  width:46px;height:46px;border-radius:13px;border:2px solid transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;
}
.v47-icon-preset.selected{border-color:#0f2a30;transform:scale(1.06)}

@keyframes v47Fade{from{opacity:0}to{opacity:1}}
@keyframes v47PadUp{from{transform:translateY(22px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(max-width:520px){
  .v47-export-card{grid-template-columns:1fr}
  .v47-numpad{border-radius:20px 20px 0 0}
}
@media(prefers-reduced-motion:reduce){
  .v47-numpad-overlay,.v47-numpad,.v47-tutorial-spot{animation:none!important;transition:none!important}
}


/* ============================================================
   v48 — close-day image/share + true Android launcher icon picker
   ============================================================ */
.v48-close-export-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.v48-close-export-grid .btn{
  justify-content:center;
  min-height:42px;
  padding-inline:7px;
}
.v48-launcher-picker{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}
.v48-launcher-choice{
  border:1px solid var(--border);
  background:#fff;
  border-radius:14px;
  padding:8px 5px;
  font-family:inherit;
  color:var(--ink);
  font-size:9.5px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:transform .08s ease,border-color .12s ease,box-shadow .12s ease;
}
.v48-launcher-choice:active{transform:scale(.96)}
.v48-launcher-choice.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-light);
}
.v48-launcher-preview{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 7px 17px rgba(15,42,48,.14);
}
@media(max-width:390px){
  .v48-close-export-grid{grid-template-columns:1fr 1fr}
  .v48-close-export-grid .btn:first-child{grid-column:1/-1}
  .v48-launcher-picker{grid-template-columns:repeat(2,1fr)}
}


/* ============================================================
   v49 — choose invoice payment only when confirming the sale
   ============================================================ */
.checkout-options-customer-only{
  grid-template-columns:1fr!important;
}
.v49-payment-modal{
  max-width:390px!important;
}
.v49-payment-icon{
  width:48px;height:48px;border-radius:16px;
  margin:0 auto;
  background:linear-gradient(135deg,var(--accent-dark),var(--accent));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(8,145,178,.20);
}
.v49-payment-total{
  background:#f5fafb;border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.v49-payment-total span{
  color:var(--muted);font-size:11px;font-weight:800;
}
.v49-payment-total b{
  font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;
}
.v49-payment-choices{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.v49-payment-choice{
  border:2px solid transparent;border-radius:17px;
  min-height:92px;font-family:inherit;font-size:16px;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;transition:transform .08s ease,box-shadow .12s ease,filter .12s ease;
}
.v49-payment-choice:active{transform:scale(.96);filter:brightness(.97)}
.v49-payment-choice.cash{
  background:#ecfdf5;color:#166534;border-color:#bbf7d0;
}
.v49-payment-choice.click{
  background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;
}
.v49-payment-symbol{
  min-width:45px;height:31px;padding:0 8px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);font-size:11px;font-weight:900;
}
@media(max-width:360px){
  .v49-payment-choice{min-height:80px}
}


/* ============================================================
   v50 — premium cart + truly interactive tutorial
   ============================================================ */

/* ---------- Cart ---------- */
.sales-cart-modern{
  border:1px solid color-mix(in srgb,var(--border) 78%,var(--accent) 22%)!important;
  background:linear-gradient(180deg,#ffffff 0%,#fbfdfd 100%)!important;
}
.v50-cart-head{
  padding-bottom:12px!important;
}
.v50-cart-title-wrap{min-width:0}
.v50-cart-head-meta{
  display:flex;align-items:center;gap:5px;
  margin-top:4px;color:var(--muted);font-size:9.5px;font-weight:800;
}
.v50-cart-dot{opacity:.45}
.v50-cart-items{gap:9px!important}
.v50-cart-item{
  display:block!important;
  padding:11px!important;
  border-radius:15px!important;
  border:1px solid #e2ecee!important;
  box-shadow:0 8px 22px -22px rgba(15,42,48,.75);
  transition:border-color .12s ease,transform .08s ease,background .12s ease;
}
.v50-cart-item:focus-within{border-color:var(--accent)!important;background:#fcffff}
.v50-cart-item-top{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:9px;
}
.v50-cart-index{
  width:27px;height:27px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:var(--accent-light);color:var(--accent-dark);
  font-size:10px;font-weight:900;
}
.v50-cart-product{min-width:0}
.v50-cart-product .cart-item-name{
  font-size:calc(12px*var(--font-scale))!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v50-cart-product .cart-item-price{
  margin-top:2px!important;font-size:calc(9.5px*var(--font-scale))!important;
}
.v50-cart-remove{
  width:30px;height:30px;border-radius:10px;border:1px solid #fee2e2;
  background:#fff7f7;color:#b91c1c;font-family:inherit;font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  line-height:1;transition:transform .08s ease,background .1s ease;
}
.v50-cart-remove:active{transform:scale(.94);background:#fee2e2}
.v50-cart-item-bottom{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed #e3ecee;
}
.v50-cart-qty{
  padding:3px!important;gap:4px!important;border:1px solid var(--border);
  background:#f5f9fa!important;border-radius:13px!important;
}
.v50-qty-btn{
  width:36px!important;height:36px!important;border:0!important;
  background:#fff!important;color:var(--accent-dark)!important;
  box-shadow:0 2px 8px rgba(15,42,48,.06);
}
.v50-qty-number{
  border:0!important;background:transparent!important;
  min-width:46px!important;height:36px;padding:0 8px!important;
  font-family:inherit;color:var(--ink);font-size:16px;font-weight:900;
  cursor:pointer;position:relative;
}
.v50-qty-number:after{content:''}
.v50-line-total-wrap{
  min-width:104px;text-align:left;direction:rtl;
}
.v50-line-total-wrap span{
  display:block;color:var(--muted);font-size:8.8px;font-weight:800;margin-bottom:2px;
}
.v50-line-total-wrap b{
  display:block;color:var(--ink);font-size:calc(14px*var(--font-scale));
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.v50-discount-note{
  display:none;margin-top:8px;padding:6px 8px;border-radius:9px;
  background:#ecfdf5;color:#047857;font-size:8.8px;font-weight:900;
}
.v50-discount-note.active{display:block}
.v50-cart-total-panel{
  background:linear-gradient(145deg,#eefcff,#f0fdf4)!important;
  border-color:#bae6fd!important;padding:13px!important;
}
.v50-cart-summary-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.v50-cart-summary-sub{
  margin-top:3px;color:var(--muted);font-size:9px;font-weight:800;
}
.v50-checkout{
  margin-top:11px!important;
  display:flex!important;align-items:center!important;justify-content:space-between!important;
  gap:10px;padding-inline:14px!important;
}
.v50-checkout>span{display:flex;align-items:center;gap:7px}
.v50-checkout-total{
  font-size:13px;white-space:nowrap;padding:5px 8px;border-radius:9px;
  background:rgba(255,255,255,.17);
}
.v50-checkout-hint{
  text-align:center;color:var(--muted);font-size:8.8px;font-weight:700;margin-top:7px;
}
.v50-empty-cart{
  min-height:210px!important;display:flex!important;flex-direction:column;
  align-items:center;justify-content:center;gap:6px!important;padding:20px!important;
}
.v50-empty-cart .v50-empty-icon{
  width:56px;height:56px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-light);color:var(--accent-dark);margin-bottom:3px;
}
.v50-empty-cart strong{font-size:13px;color:var(--ink)}
.v50-empty-cart span{font-size:10.5px;color:var(--muted)}
.v50-empty-cart small{max-width:280px;text-align:center;line-height:1.55;color:var(--muted)}

/* ---------- Tutorial ---------- */
/* No blocking full-screen dim panel: the real highlighted control stays tappable. */
.v50-tutorial-layer{
  pointer-events:none!important;
}
.v50-tutorial-layer .v47-tutorial-spot{
  pointer-events:none!important;
  border:3px solid #67e8f9!important;
  box-shadow:0 0 0 9999px rgba(5,25,30,.67),0 0 0 7px rgba(103,232,249,.14)!important;
  z-index:1351;
}
.v50-tutorial-layer .v47-tutorial-spot.interactive{
  animation:v50SpotPulse 1.15s ease-in-out infinite;
}
.v50-tutorial-layer .v47-tutorial-card{
  pointer-events:auto!important;
  z-index:1352;
  border:1px solid rgba(8,145,178,.18);
}
.v47-tutorial-card.v50-card-top{
  top:calc(68px + env(safe-area-inset-top,0px))!important;
  bottom:auto!important;
}
.v50-tutorial-topline{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:8px;
}
.v50-tutorial-step{
  color:var(--muted);font-size:9.5px;font-weight:900;
}
.v50-tutorial-mode{
  padding:4px 7px;border-radius:999px;background:#f1f5f9;color:#475569;
  font-size:8.5px;font-weight:900;
}
.v50-tutorial-mode.live{background:#ecfeff;color:#0e7490}
.v50-tutorial-live{
  display:flex;align-items:center;gap:7px;margin-top:10px;
  padding:8px 10px;border-radius:11px;background:#ecfeff;color:#0e7490;
  font-size:9.5px;font-weight:900;
}
.v50-live-dot{
  width:8px;height:8px;border-radius:50%;background:#06b6d4;
  box-shadow:0 0 0 4px rgba(6,182,212,.13);
  animation:v50LivePulse 1s ease-in-out infinite;
}
.v50-wait-btn{
  flex:1;justify-content:center!important;
  background:#f1f5f9!important;color:#64748b!important;border:1px solid #e2e8f0!important;
  opacity:1!important;
}
.v50-tutorial-action{flex:1;justify-content:center!important}

@keyframes v50SpotPulse{
  0%,100%{border-color:#67e8f9;filter:brightness(1)}
  50%{border-color:#22d3ee;filter:brightness(1.12)}
}
@keyframes v50LivePulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(.78);opacity:.55}
}

@media(max-width:430px){
  .v50-cart-item-bottom{align-items:stretch}
  .v50-line-total-wrap{min-width:92px}
  .v50-cart-qty{flex:1;justify-content:space-between}
  .v50-qty-number{flex:1}
  .v50-checkout{min-height:56px!important}
}
@media(max-width:350px){
  .v50-cart-item-bottom{flex-direction:column}
  .v50-line-total-wrap{text-align:right}
}
@media(prefers-reduced-motion:reduce){
  .v50-tutorial-layer .v47-tutorial-spot.interactive,.v50-live-dot{animation:none!important}
}


/* ============================================================
   v51 — redesigned top bar for SALES page only
   ============================================================ */
.topbar.sales-topbar-v51{
  position:relative!important;
  overflow:hidden!important;
  padding:13px 14px 12px!important;
  background:
    linear-gradient(145deg,#07566c 0%,var(--accent-dark) 48%,var(--accent) 100%)!important;
  color:#fff!important;
  border-radius:0 0 20px 20px;
  box-shadow:0 9px 24px rgba(8,67,83,.16);
}
.sales-topbar-v51:after{
  content:'';
  position:absolute;
  left:14px;right:14px;bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
}
.v51-topbar-glow{
  position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.08);filter:blur(2px);
}
.v51-glow-a{width:150px;height:150px;left:-58px;top:-88px}
.v51-glow-b{width:110px;height:110px;right:-48px;bottom:-62px}

.v51-brand-row{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.v51-brand-main{
  display:flex;align-items:center;gap:10px;min-width:0;
}
.v51-brand-logo{

/* ============================================================
   v53 — responsive tutorial + simplified report dashboard
   ============================================================ */

/* Product pictures: make generated illustrations fill the tile cleanly. */
.product-image-wrap{
  background:linear-gradient(145deg,#f9feff,#edf9fc)!important;
  border:1px solid #e1f1f5;
}
.product-image{
  object-fit:contain!important;
  padding:2px;
  border-radius:10px;
}

/* Tutorial: the instruction card is now positioned by JS relative to the real target. */
#v47-tutorial .v47-tutorial-card{
  right:auto!important;
  bottom:auto!important;
  margin:0!important;
  max-height:min(310px,calc(100dvh - 20px));
  overflow:auto;
  transition:left .13s ease-out,top .13s ease-out,width .13s ease-out;
}
#v47-tutorial .v47-tutorial-spot{
  transition:left .12s ease-out,top .12s ease-out,width .12s ease-out,height .12s ease-out,border-color .12s ease;
}
#v47-tutorial .v47-tutorial-card[data-placement="below"]::before,
#v47-tutorial .v47-tutorial-card[data-placement="above"]::before{
  content:'';
  position:absolute;
  width:12px;height:12px;
  background:#fff;
  transform:rotate(45deg);
  left:50%;
  margin-left:-6px;
}
#v47-tutorial .v47-tutorial-card[data-placement="below"]::before{top:-6px}
#v47-tutorial .v47-tutorial-card[data-placement="above"]::before{bottom:-6px}

/* Reports */
.page-report{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.v53-report-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 13px!important;
}
.v53-report-title-wrap{
  display:flex;align-items:center;gap:9px;min-width:0;
}
.v53-report-icon{
  width:39px;height:39px;border-radius:12px;
  background:var(--accent-light);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;flex:0 0 39px;
}
.v53-report-date{
  margin-top:3px;color:var(--muted);font-size:9.5px;font-weight:700;
}
.v53-report-hero{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(155px,.5fr);
  gap:9px;
}
.v53-profit-main{
  border-radius:18px;padding:17px;
  background:linear-gradient(145deg,#083344,#0e7490);
  color:#fff;min-height:128px;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 10px 25px rgba(8,51,68,.12);
}
.v53-profit-main>span{font-size:10px;color:#cffafe;font-weight:800}
.v53-profit-main>strong{
  margin-top:5px;font-size:clamp(27px,5vw,38px);
  line-height:1.05;font-variant-numeric:tabular-nums;
}
.v53-profit-main>strong.negative{color:#fecaca}
.v53-profit-main>small{margin-top:6px;color:rgba(255,255,255,.65);font-size:8.8px}
.v53-hero-side{
  display:grid;grid-template-rows:1fr 1fr;gap:8px;
}
.v53-hero-side>div{
  padding:11px 12px;border:1px solid var(--border);border-radius:15px;background:var(--card);
  display:flex;flex-direction:column;justify-content:center;
}
.v53-hero-side span{font-size:9px;color:var(--muted);font-weight:800}
.v53-hero-side b{margin-top:4px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.v53-report-kpis{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
}
.v53-report-kpi{
  border:1px solid var(--border);border-radius:14px;background:var(--card);

}
.v53-report-kpi span{display:block;font-size:8.8px;font-weight:800;color:var(--muted)}
.v53-report-kpi b{display:inline-block;margin-top:5px;font-size:18px;font-variant-numeric:tabular-nums}
.v53-report-kpi small{font-size:8px;margin-inline-start:3px;color:var(--muted)}
.v53-report-kpi.cash b{color:#047857}
.v53-report-kpi.click b{color:#1d4ed8}
.v53-report-kpi.expense b{color:#b91c1c}
.v53-report-kpi.wage b{color:#6d28d9}

.v53-report-overview{padding:13px!important}
.v53-report-section-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;
}
.v53-report-section-head h3{margin:0;font-size:12.5px}
.v53-report-section-head>div>span{display:block;margin-top:2px;font-size:8.5px;color:var(--muted)}
.v53-best-chip{
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--accent-light);color:var(--accent-dark);

}
.v53-payment-bars{display:grid;gap:9px}
.v53-bar-label{display:flex;justify-content:space-between;font-size:9px;font-weight:800;margin-bottom:4px}
.v53-bar-track{height:9px;background:#edf2f4;border-radius:999px;overflow:hidden}
.v53-bar-track span{display:block;height:100%;border-radius:inherit;min-width:2px}
.v53-bar-track span.cash{background:#10b981}
.v53-bar-track span.click{background:#3b82f6}
.v53-money-list{
  margin-top:12px;border-top:1px solid var(--border);padding-top:6px;
}
.v53-money-list>div,.v53-seller-row,.v53-alert-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 1px;border-bottom:1px solid #edf2f4;font-size:9.8px;
}
.v53-money-list>div:last-child,.v53-seller-row:last-child,.v53-alert-row:last-child{border-bottom:0}
.v53-money-list b,.v53-seller-row b,.v53-alert-row b{white-space:nowrap}
.v53-money-list .good{color:#047857}
.v53-money-list .warn{color:#b45309}
.v53-money-list .bad{color:#b91c1c}
.v53-alert-card{border-color:#fed7aa!important;background:#fffaf3!important}
.v53-alert-row b{color:#b45309}
.v53-report-section-label{
  font-size:10px;color:var(--muted);font-weight:900;margin:1px 2px 6px;
}

.v53-report-details{
  padding:0!important;overflow:hidden;
}
.v53-report-details>summary{
  list-style:none;cursor:pointer;
  min-height:49px;padding:11px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10.5px;font-weight:900;
}
.v53-report-details>summary::-webkit-details-marker{display:none}
.v53-report-details>summary span{display:flex;align-items:center;gap:7px}
.v53-report-details>summary b{

  padding:4px 7px;border-radius:999px;
}
.v53-report-details[open]>summary{border-bottom:1px solid var(--border)}
.v53-details-body{padding:11px 12px 13px}
.v53-invoice-list{display:grid;gap:8px;margin-top:8px}
.v53-invoice-card{

}

.v53-invoice-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.v53-invoice-number{font-weight:900;color:var(--accent-dark);font-size:11px}
.v53-invoice-meta{margin-top:3px;font-size:8.5px;color:var(--muted)}
.v53-invoice-total{font-weight:900;font-size:13px;white-space:nowrap}
.v53-invoice-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}

.v53-invoice-actions .btn{padding:6px 8px;font-size:8.5px}

.v53-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.v53-close-day-card{

}

.v53-close-day-card .btn-success:disabled{opacity:.45;cursor:not-allowed}

@media(max-width:620px){

  try{
    if(window.storage){
      await window.storage.set(key, serialized);
      saved = true;
    }
  }catch(e){ storageDegraded = true; }
  if(saved) storageDegraded = false;
  renderStatusPill();
}


function migrateLegacyLocalStorage(){
  const keys=['config','catalog','today','archive'];
  keys.forEach(key=>{
    try{
      const newKey='water_station_'+key;
      if(localStorage.getItem(newKey)===null && localStorage.getItem(key)!==null){
        localStorage.setItem(newKey, localStorage.getItem(key));
      }
    }catch(e){}
  });
}

function syncAccentLightV55(){
  const root=document.documentElement;
  const raw=root.style.getPropertyValue('--theme-accent-light') || '#cffafe';
  const accent=root.style.getPropertyValue('--accent') || '#0891b2';
  if(root.dataset.appearance==='dark'){
    root.style.setProperty('--accent-light',`color-mix(in srgb, ${accent} 18%, #101e22)`);
  }else{
    root.style.setProperty('--accent-light',raw);
  }
}
function applyTheme(name){
  const preset = THEMES[name] || THEMES.ocean;
  const custom = S?.config?.themeShades;
  const t = (name === 'custom' && custom?.accent && custom?.dark && custom?.light) ? custom : preset;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent-dark', t.dark);
  document.documentElement.style.setProperty('--theme-accent-light', t.light);
  syncAccentLightV55();
}
const appearanceMediaV55 = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function resolvedAppearanceV55(mode){
  if(mode==='system') return appearanceMediaV55?.matches ? 'dark' : 'light';
  return mode==='dark' ? 'dark' : 'light';
}
function applyAppearanceV55(mode='light'){
  const resolved=resolvedAppearanceV55(mode);
  const root=document.documentElement;
  root.dataset.appearance=resolved;
  root.dataset.appearanceMode=mode;
  root.style.colorScheme=resolved;

  const meta=document.getElementById('app-theme-color');
  if(meta) meta.setAttribute('content',resolved==='dark' ? '#091316' : '#f2f8f9');

  syncAccentLightV55();

  window.dispatchEvent(new CustomEvent('waterstation-appearance-change',{
    detail:{mode,resolved}
  }));
}
appearanceMediaV55?.addEventListener?.('change',()=>{
  if(typeof S!=='undefined' && S?.config?.appearance==='system'){
    applyAppearanceV55('system');
    if(typeof render==='function') render();
  }
});
function applyFontScale(scale){
  document.documentElement.style.setProperty('--font-scale', scale);
}

function shiftCouponCount(shift, source=S.today){
  const normalizedShift=shift==='مسائي'?'مسائي':'صباحي';
  if(normalizedShift==='مسائي') return Number(source.eveningCoupons||0);
  if(source.morningCoupons!==undefined) return Number(source.morningCoupons||0);
  return Number(source.coupons||0);
}

/* ============================================================
   DERIVED TOTALS
   ============================================================ */
function shiftTotals(shift, source=S.today){
  const normalizedShift = shift==='مسائي' ? 'مسائي' : 'صباحي';
  const invoices=(source.invoices||[]).filter(i=>!i.cancelled&&(i.shift||'صباحي')===normalizedShift);
  const totalSales=invoices.reduce((s,i)=>s+Number(i.total||0),0);
  const cashSales=invoices.filter(i=>(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const clickSales=invoices.filter(i=>(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const totalCost=invoices.reduce((sum,inv)=>sum+(inv.items||[]).reduce((s,it)=>s+(Number(it.product?.cost||0)*Number(it.quantity||0)),0),0);
  const draws=(source.draws||[]).filter(x=>(x.shift||'صباحي')===normalizedShift);
  const expenses=(source.expenses||[]).filter(x=>(x.shift||'صباحي')===normalizedShift);
  const wages=(source.wages||[]).filter(x=>(x.shift||'صباحي')===normalizedShift);
  const totalDraws=draws.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalExpenses=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const totalWages=wages.reduce((s,x)=>s+Number(x.hours||0)*Number(x.rate||0),0);
  const operatingOutflows=totalExpenses+totalWages;
  const cashOutflows=totalDraws+operatingOutflows;
  const payouts=cashOutflows;
  const grossProfit=totalSales-totalCost;
  const operatingNetProfit=grossProfit-operatingOutflows;
  const openingCash=normalizedShift==='صباحي'
    ? Number(source.morningOpeningCash ?? source.openingCash ?? 0)
    : Number(source.eveningOpeningCash ?? 0);
  const actualRaw=normalizedShift==='صباحي'
    ? (source.morningActualCash ?? '')
    : (source.eveningActualCash ?? source.actualCash ?? '');
  const actualCash=(actualRaw===''||actualRaw===null||actualRaw===undefined)?null:Number(actualRaw);
  const cashBeforePersonalDraws=openingCash+cashSales-operatingOutflows;
  const expectedCash=cashBeforePersonalDraws-totalDraws;
  const cashDiff=actualCash===null?null:actualCash-expectedCash;
  const couponCount=shiftCouponCount(normalizedShift,source);
  return {shift:normalizedShift,totalSales,cashSales,clickSales,totalCost,grossProfit,operatingNetProfit,totalDraws,totalExpenses,totalWages,operatingOutflows,cashOutflows,payouts,openingCash,actualCash,cashBeforePersonalDraws,expectedCash,cashDiff,couponCount,invoiceCount:invoices.length,draws,expenses,wages};
}
function totals(){
  const t = S.today;
  const validInvoices = (t.invoices||[]).filter(i=>!i.cancelled);
  const totalSales = validInvoices.reduce((s,i)=>s+Number(i.total||0),0);
  const cashSales = validInvoices.filter(i=>(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const clickSales = validInvoices.filter(i=>(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0);
  const totalCost = validInvoices.reduce((sum,inv)=>sum+(inv.items||[]).reduce((s,it)=>s+(Number(it.product?.cost||0)*Number(it.quantity||0)),0),0);
  const grossProfit = totalSales - totalCost;
  const totalDraws = (t.draws||[]).reduce((s,i)=>s+Number(i.amount||0),0);
  const totalExpenses = (t.expenses||[]).reduce((s,i)=>s+Number(i.amount||0),0);
  const totalWages = (t.wages||[]).reduce((s,i)=>s+(Number(i.hours||0)*Number(i.rate||0)),0);
  const operatingOutflows=totalExpenses+totalWages;
  const operatingNetProfit = grossProfit - operatingOutflows;
  const cashOutflows = totalDraws+operatingOutflows;
  const payouts = cashOutflows;
  const cashBeforePersonalDraws = cashSales-operatingOutflows;
  const cashNet = cashBeforePersonalDraws-totalDraws;
  const finalNet = totalSales-operatingOutflows;
  return {totalSales,cashSales,clickSales,totalCost,grossProfit,operatingNetProfit,totalDraws,totalExpenses,totalWages,operatingOutflows,cashOutflows,payouts,cashBeforePersonalDraws,cashNet,finalNet,activeInvoiceCount:validInvoices.length,cancelledInvoiceCount:(t.invoices||[]).length-validInvoices.length,morning:shiftTotals('صباحي'),evening:shiftTotals('مسائي')};
}
function effectiveUnitPrice(product, quantity=1){
  const base=Number(product?.price||0);
  const threshold=Number(product?.bulkThreshold||0);
  const bulk=Number(product?.bulkPrice||0);
  return threshold>0 && bulk>0 && Number(quantity||0)>=threshold ? bulk : base;
}
function cartLineTotal(item){ return effectiveUnitPrice(item.product,item.quantity)*Number(item.quantity||0); }
function cartTotal(){ return S.today.cart.reduce((s,i)=>s+cartLineTotal(i),0); }
function invoiceItemsFromCart(){
  return (S.today.cart||[]).map(item=>{
    const unitPrice=effectiveUnitPrice(item.product,item.quantity);
    const discounted=unitPrice!==Number(item.product?.price||0);
    return {...JSON.parse(JSON.stringify(item)),unitPrice,lineTotal:unitPrice*Number(item.quantity||0),product:{...JSON.parse(JSON.stringify(item.product)),originalPrice:Number(item.product?.price||0),price:unitPrice,bulkApplied:discounted}};
  });
}

function productImageHtml(product){
  const src=product?.image || DEFAULT_PRODUCT_IMAGES[String(product?.id||'')] || '';
  if(src) return `<img class="product-image" src="${src}" alt="${escapeHtml(product.name||'منتج')}" loading="lazy">`;
  const letter=(product?.name||'م').trim().charAt(0)||'م';
  return `<div class="product-image-placeholder">${escapeHtml(letter)}</div>`;
}
function compressProductImage(file,maxSide=480,quality=.78){
  return new Promise((resolve,reject)=>{
    if(!file?.type?.startsWith('image/')) return reject(new Error('اختر ملف صورة صحيحاً'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('تعذر معالجة الصورة'));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function updateCartQuantityDOM(productId){
  const cart=S.today.cart||[];
  const item=cart.find(i=>String(i.product.id)===String(productId));
  const row=document.querySelector(`[data-cart-item-id="${CSS.escape(String(productId))}"]`);

  // Structural change: create/remove rows through the cart renderer.
  if(item && !row){ refreshSalesCart(); return; }
  if(!item){ refreshSalesCart(); return; }

  const qtyEl=row.querySelector('.cart-qty-number');
  const priceEl=row.querySelector('.cart-item-price');
  const lineTotalEl=row.querySelector('.cart-line-total');
  const discountEl=row.querySelector('.v50-discount-note');

  const unit=effectiveUnitPrice(item.product,item.quantity);
  const base=Number(item.product.price||0);
  const discounted=unit!==base;

  if(qtyEl){
    qtyEl.textContent=String(item.quantity);
    qtyEl.classList.remove('qty-updated');
    requestAnimationFrame(()=>qtyEl.classList.add('qty-updated'));
    setTimeout(()=>qtyEl.classList.remove('qty-updated'),170);
  }
  if(priceEl) priceEl.textContent=`${unit.toFixed(2)} د.أ للوحدة`;
  if(lineTotalEl) lineTotalEl.textContent=`${cartLineTotal(item).toFixed(2)} د.أ`;
  if(discountEl){
    discountEl.classList.toggle('active',discounted);
    discountEl.textContent=discounted
      ? `✓ تم تطبيق سعر الكمية — وفّرت ${((base-unit)*item.quantity).toFixed(2)} د.أ`
      : '';
  }

  const units=cart.reduce((sum,x)=>sum+Number(x.quantity||0),0);
  const lines=cart.length;
  const total=cartTotal();

  document.querySelectorAll('#sales-cart-card .v50-cart-index').forEach((el,i)=>el.textContent=String(i+1));

  const countEl=document.querySelector('#sales-cart-card .cart-count-badge');
  const headLines=document.querySelector('#sales-cart-card .v50-cart-lines');
  const headUnits=document.querySelector('#sales-cart-card .v50-cart-units');
  const sumLines=document.querySelector('#sales-cart-card .v50-summary-lines');
  const sumUnits=document.querySelector('#sales-cart-card .v50-summary-units');
  const totalEl=document.querySelector('#sales-cart-card .cart-total-value');
  const checkoutTotal=document.querySelector('#sales-cart-card .v50-checkout-total');

  if(countEl) countEl.textContent=String(units);
  if(headLines) headLines.textContent=`${lines} ${lines===1?'صنف':'أصناف'}`;
  if(headUnits) headUnits.textContent=`${units} قطعة`;
  if(sumLines) sumLines.textContent=String(lines);
  if(sumUnits) sumUnits.textContent=String(units);
  if(totalEl) totalEl.textContent=total.toFixed(2)+' د.أ';
  if(checkoutTotal) checkoutTotal.textContent=total.toFixed(2)+' د.أ';
}

function shiftDiffRows(){
  const morning = S.today.morningJard?.items || [];
  const evening = S.today.eveningJard?.items || [];
  return morning.map(m=>{
    const e = evening.find(x=>x.id===m.id) || {count:0};
    return {name:m.name, m:m.count, e:e.count||0, diff:m.count-(e.count||0)};
  });
}
function bestSeller(){
  const map={};
  (S.today.invoices||[]).filter(inv=>!inv.cancelled).forEach(inv=>(inv.items||[]).forEach(it=>{
    const k=it.product?.name||'منتج'; map[k]=(map[k]||0)+Number(it.quantity||0);
  }));
  return Object.entries(map).sort((a,b)=>b[1]-a[1])[0] || ['لا يوجد',0];
}
function recentSalesBars(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=dayKey(d.toISOString());
    let total=0;
    S.archive.filter(x=>dayKey(x.date)===key).forEach(x=>total+=Number(x.totals?.totalSales||0));
    if(i===0) total+=totals().totalSales;
    days.push({label:d.toLocaleDateString('ar-EG',{weekday:'short'}),total});
  }
  const max=Math.max(...days.map(x=>x.total),1);
  return `<div class="mini-bars">${days.map(x=>`<div class="mini-bar-wrap"><div class="mini-bar" style="height:${Math.max(5,(x.total/max)*78)}px" title="${x.total.toFixed(2)} د.أ"></div><span class="mini-bar-label">${x.label}</span></div>`).join('')}</div>`;
}

/* ============================================================
   PAGE: ARCHIVE
   ============================================================ */

const WEEKDAYS_AR=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function dayKey(iso){
  const d=new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDate(iso){
  try{return new Date(iso).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});}
  catch(e){return iso||'-';}
}
function archiveByDay(){
  const map={};
  (S.archive||[]).forEach(rec=>{
    const k=dayKey(rec.date);
    (map[k]=map[k]||[]).push(rec);
  });
  return map;
}
function ensureCalState(){
  const now=new Date();
  if(!jardInputs.cal) jardInputs.cal={year:now.getFullYear(),month:now.getMonth()};
  return jardInputs.cal;
}
function archivePage(){
  const cal=ensureCalState();
  const byDay=archiveByDay();
  const todayKey=dayKey(new Date().toISOString());
  const allKeys=Object.keys(byDay).sort().reverse();
  const selKey=jardInputs.archiveSel||allKeys[0]||todayKey;
  const selRecords=byDay[selKey]||[];

  const first=new Date(cal.year,cal.month,1);
  const startOffset=first.getDay();
  const daysInMonth=new Date(cal.year,cal.month+1,0).getDate();
  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const k=`${cal.year}-${String(cal.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs=byDay[k]||[];
    const hasData=recs.length>0;
    const deficit=hasData&&recs.some(r=>Number(r.totals?.operatingNetProfit ?? ((r.totals?.totalSales||0)-(r.totals?.totalCost||0)-(r.totals?.totalExpenses||0)-(r.totals?.totalWages||0)))<0);
    const cls=['cal-cell'];
    if(hasData) cls.push('has-data');
    if(deficit) cls.push('deficit');
    if(k===todayKey) cls.push('today');
    if(k===selKey&&hasData) cls.push('selected');
    cells+=`<div class="${cls.join(' ')}" ${hasData?`data-day="${k}"`:''}>
      <span>${d}</span>${hasData?'<span class="cal-dot"></span>':''}
    </div>`;
  }

  return `
  <div class="card flex-between">
    <h2 class="section-title">${icon('archive',20)} الأرشيف</h2>
    ${selRecords.length?`<button class="btn btn-action" id="btn-print-archive">${icon('download',13)} PDF</button>`:''}
  </div>

  <div class="card print-hidden">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-next">›</button>
      <span class="cal-title">${MONTHS_AR[cal.month]} ${cal.year}</span>
      <button class="cal-nav-btn" id="cal-prev">‹</button>
    </div>
    <div class="cal-weekdays">${WEEKDAYS_AR.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>

  ${(S.archive||[]).length===0
    ? `<div class="card"><div class="empty-state">${icon('archive',26)}<span>لم يتم إغلاق أي يوم بعد</span></div></div>`
    : selRecords.length===0
      ? `<div class="card"><div class="empty-state"><span>لا توجد بيانات في اليوم المحدد</span></div></div>`
      : `<div class="card">
          <h3 class="sub-title">خلاصة يوم ${formatDate(selRecords[0].date)}</h3>
          ${selRecords.map(day=>archiveSummaryBody(day)).join('')}
        </div>`}
  `;
}

function archiveShiftAccountHtml(day,shift){
  const st=shiftTotals(shift,day);
  const type=shift==='مسائي'?'evening':'morning';
  return `<div class="shift-account-card ${type}" style="margin-top:8px"><div class="flex-between"><b>الشفت ${shift}</b><span class="shift-finance-tag ${type}">${st.invoiceCount} فاتورة</span></div><div class="shift-account-lines"><div class="flex-between"><span>إجمالي المبيعات</span><b>${st.totalSales.toFixed(2)} د.أ</b></div><div class="flex-between"><span>نقدي / كليك</span><b>${st.cashSales.toFixed(2)} / ${st.clickSales.toFixed(2)}</b></div><div class="flex-between"><span>أوراق الكوبون</span><b>${st.couponCount} ورقة</b></div><div class="flex-between"><span>سحب شخصي نقدي</span><b>${st.totalDraws.toFixed(2)} د.أ</b></div><div class="flex-between"><span>مصاريف / أجور</span><b>${st.totalExpenses.toFixed(2)} / ${st.totalWages.toFixed(2)}</b></div><div class="flex-between"><span>العهدة</span><b>${st.openingCash.toFixed(2)} د.أ</b></div><div class="flex-between shift-account-total"><span>المتوقع / الفعلي</span><b>${st.expectedCash.toFixed(2)} / ${st.actualCash===null?'—':st.actualCash.toFixed(2)} د.أ</b></div><div class="cash-result ${st.cashDiff===null?'warn':Math.abs(st.cashDiff)<.01?'ok':'bad'}"><span>${st.cashDiff===null?'غير مدخل':Math.abs(st.cashDiff)<.01?'متطابق':st.cashDiff<0?'عجز':'زيادة'}</span><span>${st.cashDiff===null?'—':st.cashDiff.toFixed(2)+' د.أ'}</span></div></div></div>`;
}

function archiveSummaryBody(day){
  const t = day.totals||{};
  const invoices=(day.invoices||[]);
  const activeCount=invoices.filter(i=>!i.cancelled).length;
  const cancelledCount=invoices.length-activeCount;
  const cashSales=Number(t.cashSales ?? invoices.filter(i=>!i.cancelled&&(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0));
  const clickSales=Number(t.clickSales ?? invoices.filter(i=>!i.cancelled&&(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0));
  const cashNet=Number(t.cashNet ?? (cashSales-Number(t.totalDraws||0)-Number(t.totalExpenses||0)-Number(t.totalWages||0)));
  const expectedCash=Number(day.openingCash||0)+cashNet;
  const archivedCashDiff=(day.actualCash===''||day.actualCash===undefined||day.actualCash===null)?null:Number(day.actualCash)-expectedCash;
  const businessCollection=Number(t.totalSales||0)-Number(t.totalExpenses||0)-Number(t.totalWages||0);
  const rows = (day.morningJard && day.eveningJard) ? day.morningJard.items.map(m=>{
    const e = day.eveningJard.items.find(x=>x.id===m.id) || {count:0};
    return {name:m.name, m:m.count, e:e.count||0, diff:m.count-(e.count||0)};
  }) : [];
  return `
  <div style="font-size:calc(12px*var(--font-scale));display:flex;flex-direction:column;gap:8px;margin-top:8px">
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>العامل المسؤول:</span><b>${escapeHtml(day.stationWorker||'-')}</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>الفواتير الفعالة:</span><b>${activeCount} فاتورة${cancelledCount?` — ملغاة ${cancelledCount}`:''}</b></div>
    <div class="shift-account-grid">${archiveShiftAccountHtml(day,'صباحي')}${archiveShiftAccountHtml(day,'مسائي')}</div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>إجمالي المبيعات:</span><b>${Number(t.totalSales||0).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>المبيعات النقدية:</span><b>${cashSales.toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>مبيعات كليك:</span><b>${clickSales.toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>تكلفة البضاعة:</span><b>${Number(t.totalCost||0).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>إجمالي الربح:</span><b>${Number(t.grossProfit ?? (t.totalSales||0)).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>صافي الربح التشغيلي:</span><b>${Number((t.operatingNetProfit ?? t.finalNet) || 0).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>أوراق الكوبون:</span><b>صباحي ${shiftCouponCount('صباحي',day)} / مسائي ${shiftCouponCount('مسائي',day)} / الإجمالي ${shiftCouponCount('صباحي',day)+shiftCouponCount('مسائي',day)}</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>السحوبات الشخصية من النقد:</span><b>${Number(t.totalDraws||0).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>المصاريف التشغيلية:</span><b>${Number(t.totalExpenses||0).toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="border-bottom:1px solid var(--bg);padding-bottom:4px"><span>أجور العمال:</span><b>${t.totalWages.toFixed(2)} د.أ</b></div>
    <div class="flex-between" style="background:${businessCollection<0?'#fef2f2':'#f0fdf4'};padding:8px;border-radius:8px;font-weight:900;color:${businessCollection<0?'var(--danger)':'#166534'}">
      <span>صافي التحصيل التشغيلي (لا يشمل السحوبات):</span><span>${businessCollection.toFixed(2)} د.أ</span>
    </div>
    ${(day.draws&&day.draws.length) ? `<div><div class="muted" style="font-size:10.5px;font-weight:800;margin-bottom:4px">السحوبات:</div>${day.draws.map(d=>`<div class="list-row" style="padding:5px 0"><span style="font-size:11px">${escapeHtml(d.desc)} ${shiftEntryLabel(d.shift||'صباحي')}</span><b style="font-size:11px">${Number(d.amount||0).toFixed(2)} د.أ</b></div>`).join('')}</div>` : ''}
    ${(day.expenses&&day.expenses.length) ? `<div><div class="muted" style="font-size:10.5px;font-weight:800;margin-bottom:4px">المصاريف:</div>${day.expenses.map(d=>`<div class="list-row" style="padding:5px 0"><span style="font-size:11px">${escapeHtml(d.desc)} ${shiftEntryLabel(d.shift||'صباحي')}</span><b style="font-size:11px">${Number(d.amount||0).toFixed(2)} د.أ</b></div>`).join('')}</div>` : ''}
    ${(day.wages&&day.wages.length) ? `<div><div class="muted" style="font-size:10.5px;font-weight:800;margin-bottom:4px">أجور العمال:</div>${day.wages.map(w=>`<div class="list-row" style="padding:5px 0"><span style="font-size:11px">${escapeHtml(w.name)} ${shiftEntryLabel(w.shift||'صباحي')} (${Number(w.hours||0)} س × ${Number(w.rate||0).toFixed(2)})</span><b style="font-size:11px">${(Number(w.hours||0)*Number(w.rate||0)).toFixed(2)} د.أ</b></div>`).join('')}</div>` : ''}
    ${rows.length ? `
    <div>
      <div class="muted" style="font-size:10.5px;font-weight:800;margin-bottom:4px">مقارنة الجرد صباحي/مسائي:</div>
      <table>
        <thead><tr><th>المادة</th><th>صباحي</th><th>مسائي</th><th>الفروق</th></tr></thead>
        <tbody>${rows.map(r=>`<tr class="${r.diff<0?'deficit-row':''}"><td>${escapeHtml(r.name)}</td><td>${r.m}</td><td>${r.e}</td><td>${r.diff}</td></tr>`).join('')}</tbody>
      </table>
    </div>` : ''}
  </div>`;
}

function makeDaySnapshot(){
  const t=totals();
  return {date:new Date().toISOString(),stationWorker:S.today.activeWorker,coupons:Number(S.today.coupons||0),morningCoupons:Number(S.today.morningCoupons||0),eveningCoupons:Number(S.today.eveningCoupons||0),totals:t,morningJard:S.today.morningJard,eveningJard:S.today.eveningJard,invoices:[...(S.today.invoices||[])],draws:[...(S.today.draws||[])],expenses:[...(S.today.expenses||[])],wages:[...(S.today.wages||[])],openingCash:Number(S.today.morningOpeningCash||S.today.openingCash||0),actualCash:S.today.eveningActualCash,morningOpeningCash:Number(S.today.morningOpeningCash||0),morningActualCash:S.today.morningActualCash,eveningOpeningCash:Number(S.today.eveningOpeningCash||0),eveningActualCash:S.today.eveningActualCash,shiftTotals:{morning:shiftTotals('صباحي'),evening:shiftTotals('مسائي')},auditLog:[...(S.today.auditLog||[])],shift:S.today.shift,openedAt:S.today.openedAt,morningShiftClosed:S.today.morningShiftClosed,morningClosedAt:S.today.morningClosedAt,morningWorker:S.today.morningWorker,eveningStartedAt:S.today.eveningStartedAt};
}
function a4Money(v){ return Number(v||0).toFixed(2)+' د.أ'; }
function buildA4SummaryHtml(day){
  const t=day.totals||{};
  const morning=shiftTotals('صباحي',day), evening=shiftTotals('مسائي',day);
  const invoices=(day.invoices||[]).filter(i=>!i.cancelled);
  const totalSales=Number(t.totalSales ?? invoices.reduce((s,i)=>s+Number(i.total||0),0));
  const cashSales=Number(t.cashSales ?? invoices.filter(i=>(i.paymentMethod||'نقدي')!=='كليك').reduce((s,i)=>s+Number(i.total||0),0));
  const clickSales=Number(t.clickSales ?? invoices.filter(i=>(i.paymentMethod||'نقدي')==='كليك').reduce((s,i)=>s+Number(i.total||0),0));
  const totalCost=Number(t.totalCost ?? invoices.reduce((sum,inv)=>sum+(inv.items||[]).reduce((s,it)=>s+(Number(it.product?.cost||0)*Number(it.quantity||0)),0),0));
  const totalDraws=Number(t.totalDraws ?? (day.draws||[]).reduce((s,x)=>s+Number(x.amount||0),0));
  const totalExpenses=Number(t.totalExpenses ?? (day.expenses||[]).reduce((s,x)=>s+Number(x.amount||0),0));
  const totalWages=Number(t.totalWages ?? (day.wages||[]).reduce((s,x)=>s+Number(x.hours||0)*Number(x.rate||0),0));
  const grossProfit=Number(t.grossProfit ?? (totalSales-totalCost));
  const operatingNetProfit=Number(t.operatingNetProfit ?? (grossProfit-totalExpenses-totalWages));
  const operatingCollection=totalSales-totalExpenses-totalWages;
  const netCashMovement=cashSales-totalExpenses-totalWages-totalDraws;
  const finalExpected=evening.invoiceCount||day.eveningStartedAt||day.eveningJard ? evening.expectedCash : morning.expectedCash;
  const finalActual=evening.actualCash!==null ? evening.actualCash : morning.actualCash;
  const finalDiff=finalActual===null ? null : finalActual-finalExpected;

  const productMap={};
  invoices.forEach(inv=>(inv.items||[]).forEach(it=>{
    const p=it.product||{};
    const key=String(p.id||p.name||'unknown');
    if(!productMap[key]) productMap[key]={name:p.name||'صنف',qty:0,total:0};
    const qty=Number(it.quantity||0);
    const lineTotal=Number(it.lineTotal ?? (effectiveUnitPrice(p,qty)*qty));
    productMap[key].qty+=qty;
    productMap[key].total+=lineTotal;
  }));
  const productRows=Object.values(productMap).sort((a,b)=>b.total-a.total);

  const inventoryRows=(day.morningJard&&day.eveningJard)?(day.morningJard.items||[]).map(m=>{
    const e=(day.eveningJard.items||[]).find(x=>x.id===m.id)||{count:0};
    return {name:m.name,m:Number(m.count||0),e:Number(e.count||0),diff:Number(m.count||0)-Number(e.count||0)};
  }):[];

  const shiftRow=(label,a,b)=>`<tr><td>${label}</td><td>${a}</td><td>${b}</td></tr>`;
  const metric=(label,value,color='#0f2a30')=>`<div style="border:1px solid #dbe4e7;border-radius:8px;padding:7px 8px;background:#fff"><div style="font-size:9px;color:#536c72;font-weight:800">${label}</div><div style="font-size:15px;font-weight:900;color:${color};margin-top:2px">${value}</div></div>`;
  const finalRow=(label,value,color='#111',em=false)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:${em?'12px 10px':'9px 10px'};border-bottom:1px solid #e5e7eb;${em?'background:#f8fafc;border-radius:8px;margin-top:5px;':''}"><span style="font-size:${em?'15px':'13px'};font-weight:${em?'900':'800'}">${label}</span><b style="font-size:${em?'22px':'17px'};color:${color};white-space:nowrap">${value}</b></div>`;

  return `<div style="width:190mm;margin:0 auto;box-sizing:border-box;color:#111;direction:rtl;font-family:'Tajawal',Arial,sans-serif">
    <section class="a4-page a4-detail-page" style="width:190mm;height:277mm;box-sizing:border-box;padding:2mm 1mm;page-break-after:always;break-after:page;overflow:hidden;font-size:10px;line-height:1.35">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0e7490;padding-bottom:6px;margin-bottom:7px">
        <div><div style="font-size:19px;font-weight:900;color:#0e7490">${escapeHtml(S.config.stationName||'محطة المياه')}</div><div style="font-size:11px;font-weight:900">ملخص البيع التفصيلي</div></div>
        <div style="text-align:left;font-size:9px"><b>${formatDate(day.date)}</b><br>طُبع: ${new Date().toLocaleString('ar-EG')}</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px">
        ${metric('إجمالي المبيعات',a4Money(totalSales),'#0e7490')}
        ${metric('نقدي',a4Money(cashSales),'#166534')}
        ${metric('كليك',a4Money(clickSales),'#1d4ed8')}
        ${metric('عدد الفواتير',String(invoices.length),'#0f2a30')}
      </div>

      <div style="font-size:11px;font-weight:900;margin:5px 0 4px">تفصيل الشفتات</div>
      <table style="width:100%;border-collapse:collapse;font-size:9px;margin:0 0 6px"><thead><tr><th style="padding:4px;background:#eef6f7">البند</th><th style="padding:4px;background:#dbeafe">الصباحي</th><th style="padding:4px;background:#ede9fe">المسائي</th></tr></thead><tbody>
        ${shiftRow('المبيعات',a4Money(morning.totalSales),a4Money(evening.totalSales))}
        ${shiftRow('نقدي / كليك',a4Money(morning.cashSales)+' / '+a4Money(morning.clickSales),a4Money(evening.cashSales)+' / '+a4Money(evening.clickSales))}
        ${shiftRow('أوراق الكوبون',morning.couponCount+' ورقة',evening.couponCount+' ورقة')}
        ${shiftRow('السحوبات الشخصية',a4Money(morning.totalDraws),a4Money(evening.totalDraws))}
        ${shiftRow('المصاريف / الأجور',a4Money(morning.totalExpenses)+' / '+a4Money(morning.totalWages),a4Money(evening.totalExpenses)+' / '+a4Money(evening.totalWages))}
        ${shiftRow('العهدة',a4Money(morning.openingCash),a4Money(evening.openingCash))}
        ${shiftRow('الكاش المتوقع',a4Money(morning.expectedCash),a4Money(evening.expectedCash))}
        ${shiftRow('الكاش الفعلي',morning.actualCash===null?'—':a4Money(morning.actualCash),evening.actualCash===null?'—':a4Money(evening.actualCash))}
        ${shiftRow('الفرق',morning.cashDiff===null?'—':a4Money(morning.cashDiff),evening.cashDiff===null?'—':a4Money(evening.cashDiff))}
      </tbody></table>

      <div style="display:grid;grid-template-columns:${inventoryRows.length?'1.2fr .8fr':'1fr'};gap:7px;align-items:start">
        <div>
          <div style="font-size:11px;font-weight:900;margin:4px 0">المبيعات حسب الصنف</div>
          ${productRows.length?`<table style="width:100%;border-collapse:collapse;font-size:8.5px;margin:0"><thead><tr><th>الصنف</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody>${productRows.slice(0,18).map(r=>`<tr><td style="text-align:right">${escapeHtml(r.name)}</td><td>${r.qty}</td><td>${a4Money(r.total)}</td></tr>`).join('')}</tbody></table>${productRows.length>18?`<div style="font-size:8px;color:#666;margin-top:3px">+ ${productRows.length-18} أصناف إضافية ضمن الإجمالي.</div>`:''}`:'<div style="padding:10px;border:1px dashed #ccc;color:#666;text-align:center">لا توجد مبيعات</div>'}
        </div>
        ${inventoryRows.length?`<div><div style="font-size:11px;font-weight:900;margin:4px 0">مختصر الجرد</div><table style="width:100%;border-collapse:collapse;font-size:8px;margin:0"><thead><tr><th>المادة</th><th>ص</th><th>م</th><th>فرق</th></tr></thead><tbody>${inventoryRows.slice(0,16).map(r=>`<tr><td style="text-align:right">${escapeHtml(r.name)}</td><td>${r.m}</td><td>${r.e}</td><td>${r.diff}</td></tr>`).join('')}</tbody></table>${inventoryRows.length>16?`<div style="font-size:8px;color:#666;margin-top:3px">+ ${inventoryRows.length-16} مواد إضافية.</div>`:''}</div>`:''}
      </div>
